11px;color:#aeb3bd;line-height:1.6;margin:5px 0 0}.blank{text-align:center;padding:45px 20px;color:#a1a5af}.blank .symbol{font-size:31px;color:var(--green);margin-bottom:10px}.blank strong{display:block;color:#f2f3f5;font-size:15px;margin-bottom:8px}.blank p{font-size:12px;line-height:1.7;max-width:360px;margin:0 auto}.rank{display:flex;align-items:center;gap:12px;border-top:1px solid #292c31;padding:17px 0}.num{font:800 21px Manrope;color:var(--green);min-width:28px}.rank strong{font-size:13px}.rank small{display:block;color:#9297a2;font-size:11px;margin-top:5px;line-height:1.5}.tag{margin-left:auto;white-space:nowrap;background:#26282d;color:#a9adb7;font-size:10px;border-radius:9px;padding:6px 8px}.note{border:1px solid #353a38;border-radius:12px;background:#171c19;padding:12px 14px;font-size:11px;line-height:1.7;color:#bfcfc5}.note strong{color:#e3f3e6}.modelgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modelgrid div{padding:13px;background:#1b1d21;border:1px solid #303238;border-radius:12px;font-size:12px;line-height:1.5}.modelgrid span{display:block;color:#a8edbd;font-size:10px;margin-bottom:5px;font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#111215f5;border-top:1px solid #31333a;display:flex;justify-content:space-around;padding:10px 0 max(13px,env(safe-area-inset-bottom));backdrop-filter:blur(18px)}.bottom button{border:0;background:none;color:#9da1aa;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;min-width:65px}.bottom button b{font-size:20px;font-weight:500}.bottom button.active{color:#b5edc5}footer{font-size:10px;line-height:1.8;color:#858b95;margin:22px 4px} .loadline{height:12px;background:linear-gradient(90deg,#1d1f23,#303238,#1d1f23);background-size:200%;animation:shine 1.4s linear infinite;border-radius:8px;margin:14px 0}@keyframes shine{to{background-position:-200% 0}}@media(min-width:740px){main{padding:22px 24px 120px}.gamegrid{grid-template-columns:repeat(2,minmax(0,1fr) <body><header class="head"><div class="headin wrap"><div><div class="brand">Sports<em>Lab</em></div><div class="subbrand">Sports intelligence</div></div><span class="status">● &nbsp; FREE DATA</span></div></header>
<main class="wrap"><div class="sportbar" id="sports"><button class="sport active" data-s="NHL"><span class="emoji">🏒</span>NHL</button><button class="sport" data-s="NFL"><span class="emoji">🏈</span>NFL</button><button class="sport" data-s="MLB"><span class="emoji">⚾</span>MLB</button></div>

<script>
let sport='NHL',tab='games',offset=0,serial=0;const nowET=new Date();const etParts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(nowET).map(x=>[x.type,x.value]));const base=new Date(Number(etParts.year),Number(etParts.month)-1,Number(etParts.day),12);const cache=new Map();
const model={NHL:[['PLAYER SHOT PROFILE','SOG, shot attempts, individual shot share, L5/L10, season and prior-season floor'],['DEFENSE BY POSITION','Opponent shots and scoring chances allowed to centers, wings and defensemen'],['MATCHUP HISTORY','H2H shot floor and ceiling, last season, home/away and strength of opponents'],['CURRENT ROLE','TOI, even-strength line, power-play unit, shifts and recent role changes'],['ON-ICE CONTEXT','Plus/minus, on-ice goal differential, defensive usage and teammates'],['GAME ENVIRONMENT','Opponent pace, goalie, back-to-back fatigue, projected lines and injuries'],['MARKET QUALITY','Exact SOG/points/assists line, odds, alternative lines and stability'],['SGP CORRELATION','Shared game script, shot opportunity and dependence between legs']],NFL:[['PLAYER OPPORTUNITY','Targets, routes, snaps, carries, air yards, L5/L10 and prior season'],['DEFENSE BY POSITION','Targets, receptions, yards and TDs allowed to WR1/WR2, TE and RB'],['MATCHUP HISTORY','H2H, last-season defensive personnel and scheme changes'],['GAME SCRIPT','Spread, pace, pass rate, coverage, pressure and likely play volume'],['ROLE AND AVAILABILITY','Depth chart, injuries, QB status, red-zone and third-down usage'],['MARKET QUALITY','Receptions vs yards, passing attempts, alt lines and current odds'],['SGP CORRELATION','QB/receiver, rushing/game script and TD dependencies']],MLB:[['BASEBALL SAVANT','Statcast xwOBA, hard-hit, barrel, whiff, chase and pitch mix'],['STARTER PROFILE','Pitch count, outs, Ks, walks, hits, earned runs and early-pull risk'],['MATCHUP SPLITS','Pitch type and handedness, batter performance and projected lineup'],['OPPONENT TRENDS','Strikeout, walk, run and hit rates versus starter profile'],['HISTORY AND FORM','L3/L5/L10 starts, season, prior season, H2H with sample size'],['GAME CONDITIONS','Ballpark, weather, umpire where verified and bullpen fatigue'],['MARKET QUALITY','Exact K/outs/ER/walk/hits/NRFI lines, prices and alternatives'],['SGP CORRELATION','Pitcher outs, runs, Ks and team totals dependencies']]};
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function day(){const d=new Date(base);d.setDate(d.getDate()+offset);return d}
function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function logo(t){const url=t.logo||'';return /^https:\/\/[a-z0-9.-]+\/[^"'<>]*$/i.test(url)?'<img class="crest" alt="" loading="lazy" src="'+esc(url)+'">':'<div class="fallback">'+esc(t.abbreviation||'?')+'</div>'}
function gameHTML(g){const a=g.away,h=g.home;const time=new Date(g.date).toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit',timeZone:'America/Toronto'});const live=g.state!=='pre';const center=live?esc(a.score??'–')+' : '+esc(h.score??'–'):'VS';const status=live?esc(g.detail||g.status):time+' ET';const name=t=>esc(t.short||t.name||t.abbreviation);return '<article class="card game" data-game="'+esc(g.id)+'" data-home="'+esc(g.home.name)+'" data-away="'+esc(g.away.name)+'"><div class="inner"><div class="gamehead"><span class="league">'+esc(sport)+' · '+esc(g.status)+'</span><span class="time">'+esc(status)+'</span></div><div class="matchup"><div class="team">'+logo(a)+'<div class="teamname">'+name(a)+'</div><span class="record">'+esc(a.record||'Away')+'</span></div><div class="mid"><div class="'+(live?'score':'vs')+'">'+center+'</div><div class="matchstate">'+(live?'Scoreboard':'Scheduled')+'</div></div><div class="team right">'+logo(h)+'<div class="teamname">'+name(h)+'</div><span class="record">'+esc(h.record||'Home')+'</span></div></div><div class="fact"><b>Matchup snapshot</b> · '+(a.record&&h.record?'Team records: '+esc(a.record)+' vs '+esc(h.record)+'.':'Pre-game team form awaiting verification.')+' Detailed player-level analysis will appear once validated.</div></div><div class="gamefoot"><span>'+esc(g.venue||'Venue not listed')+'</span><button class="detailbtn" aria-expanded="false" type="button">View analysis ↓</button></div><div class="detail"><h3>Matchup analysis</h3><div class="detailrow"><span>Game status</span><span>'+esc(g.status)+'</span></div><div class="detailrow"><span>Away record</span><span>'+esc(a.record||'Unavailable')+'</span></div><div class="detailrow"><span>Home record</span><span>'+esc(h.record||'Unavailable')+'</span></div><div class="detailrow"><span>Venue</span><span>'+esc(g.venue||'Unavailable')+'</span></div><div class="metricbox sportsbookfeed"><strong>Bookmaker odds check</strong><p>Open this game to check bet365, DraftKings, then FanDuel. Playbook odds above are aggregate estimates, not sportsbook-specific.</p></div><div class="metricbox researchfeed"><strong>Verified game research</strong><p>Open this card to retrieve available team and player box-score data. Pregame statistics and sportsbook prices are not yet integrated.</p></div></div></article>'}

const researchMarkets={NHL:[['sog','Shots on goal'],['pts','Points'],['goals','Goals'],['assists','Assists'],['blocks','Blocked shots']],NFL:[['rec','Receptions'],['receiving.yards','Receiving yards'],['rushing.yards','Rushing yards'],['passing.yards','Passing yards'],['targets','Targets'],['rushing.att','Rushing attempts'],['passing.att','Passing attempts']],MLB:[['pitching.so','Pitcher Ks'],['outs','Pitcher outs'],['pitching.bb','Pitcher walks'],['pitching.h','Pitcher hits allowed'],['er','Earned runs'],['batting.h','Batter hits'],['total_bases','Total bases']]};
const oddsCache=new Map();
function etDate(value){const d=new Date(value);if(!Number.isFinite(d.valueOf()))return '';const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d).map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day}
function cleanTeam(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/gi,'').toLowerCase()}
function amPrice(n){const x=Number(n);return Number.isFinite(x)&&x!==0?(x>0?'+':'')+x:'—'}
function implied(n){const x=Number(n);return !Number.isFinite(x)||x===0?null:x>0?100/(x+100):-x/(-x+100)}
async function playbookLines(selectedSport){const key=selectedSport.toLowerCase(),prev=oddsCache.get(key);if(prev&&Date.now()-prev.when<300000)return prev.data;const response=await fetch('/api/playbook?league='+encodeURIComponent(key)+'&kind=lines');const result=await response.json();if(!response.ok||!result.available)throw Error(result.error||'Provider prices unavailable');const data=Array.isArray(result.data)?result.data:[];oddsCache.set(key,{when:Date.now(),data});return data}
function correctDay(line,date){return etDate(line.startTime||'')===date}
function marketMarkup(x){const line=x.lines||{},ml=line.moneyline||{},sp=line.spread||{};return '<div class="marketline"><strong>Current game markets · Playbook aggregate</strong><span class="tiny"> Not verified bet365</span><div class="marketgrid"><span>'+esc(x.awayTeamName)+' ML <b>'+esc(amPrice(ml.away))+'</b></span><span>'+esc(x.homeTeamName)+' ML <b>'+esc(amPrice(ml.home))+'</b></span><span>Spread <b>'+esc(sp.home??'—')+'</b> home</span><span>Total <b>'+esc(line.total??'—')+'</b></span></div><p class="tiny">Price may change. No player props or SGP combined price verified.</p></div>'}
async function addMatchupMarkets(selectedSport,selectedDate,games,serialAtStart){try{const lines=(await playbookLines(selectedSport)).filter(x=>correctDay(x,selectedDate));if(tab!=='games'||sport!==selectedSport||serial!==serialAtStart)return;const cards=document.querySelectorAll('#games article.game');let count=0;games.forEach((g,i)=>{const record=lines.find(x=>cleanTeam(x.homeTeamName)===cleanTeam(g.home.name)&&cleanTeam(x.awayTeamName)===cleanTeam(g.away.name));if(record&&cards[i]){cards[i].querySelector('.fact').insertAdjacentHTML('afterend',marketMarkup(record));count++}});const summary=document.getElementById('marketstatus');if(summary)summary.textContent=count+' of '+games.length+' games matched · Playbook aggregate prices, not bet365'}catch(e){const summary=document.getElementById('marketstatus');if(summary)summary.textContent='Game odds temporarily unavailable · scores unaffected'}}
async function loadStatBoard(selectedSport,selectedDate,selectedStat){const box=document.getElementById('live-statboard');if(!box)return;const stat=selectedStat||researchMarkets[selectedSport][0][0];box.innerHTML='<strong>Live historical trends</strong><p class="tiny">Loading '+esc(researchMarkets[selectedSport].find(x=>x[0]===stat)?.[1]||stat)+'…</p>';try{const r=await fetch('/api/stat-board?league='+encodeURIComponent(selectedSport.toLowerCase())+'&date='+encodeURIComponent(selectedDate)+'&stat='+encodeURIComponent(stat));const p=await r.json();if(!box.isConnected||sport!==selectedSport||tab!=='props')return;if(!r.ok||!p.available){box.innerHTML='<strong>Live historical trends unavailable</strong><p class="tiny">'+esc(p.reason||'Provider unavailable')+'. Public game schedules remain accessible.</p>';return}const line=p.meta?.line;box.innerHTML='<div class="eyebrow">Live StatsHawk research · '+esc(selectedDate)+'</div><h3>'+esc(p.market||stat)+(line!=null?' · Over '+esc(line):'')+'</h3><p class="tiny">Ranked by observed last-10 hit rate, minimum 5 appearances. These are NOT betting probabilities or verified bet365 lines.</p>'+(p.picks?.length?p.picks.map((x,i)=>'<div class="rank"><div class="num">'+(i+1)+'</div><div style="min-width:0;flex:1"><strong>'+esc(x.player)+'</strong><small>'+esc(x.team||'Team unconfirmed')+' vs '+esc(x.opponent||'Opponent unconfirmed')+' · '+esc(x.sample)+' games</small><div style="margin-top:7px;font-weight:800;color:#a8edbd">L10 '+esc(Math.round(x.observedLast10Rate*100))+'% observed'+(x.seasonRate!=null?' · Season '+esc(Math.round(x.seasonRate*100))+'%':'')+'</div></div></div>').join(''):p.watchlist?.length?'<div class="note"><strong>Exploratory activity watchlist — NOT selections</strong><p>Unconfirmed projected lineups. Screening threshold: over '+esc(line??'unspecified')+' '+esc(p.market||stat)+'. This is generally not a sportsbook prop line. Tap a player for individual historical analysis.</p></div>'+p.watchlist.map((x,i)=>'<button type="button" class="watch-pick" data-name="'+esc(x.player)+'" style="display:block;width:100%;text-align:left;background:#171d19;border:1px solid #344338;border-radius:11px;color:#fff;padding:12px;margin:8px 0"><strong>'+esc(i+1)+'. '+esc(x.player)+'</strong><span class="tiny" style="display:block;margin-top:5px">'+esc(x.team||'Team unknown')+' vs '+esc(x.opponent||'Opponent unknown')+' · '+esc(x.sample)+' prior appearances · activity '+esc(Math.round(x.activityRate*100))+'% · lineup unconfirmed</span><span class="tiny" style="color:#a8edbd">Select for deeper research →</span></button>').join(''):'<div class="blank"><strong>No eligible player trends today</strong><p>Lineup coverage or recent-game samples are insufficient. Do not force ten selections.</p></div>')+'<p class="tiny">Coverage: '+esc(p.meta?.gamesWithLineups??'unknown')+' confirmed lineups, '+esc(p.meta?.gamesWithoutLineups??'unknown')+' without lineups. Data: StatsHawk. Odds and projections remain unverified.</p>';box.querySelectorAll('.watch-pick').forEach(b=>b.onclick=()=>{tab='research';render();const input=document.getElementById('playerid');input.value=b.dataset.name;document.getElementById('lookup').click()})}catch(e){box.textContent='Live trends could not be loaded. Retry later.'}}
async function loadSGPResearch(selectedSport,selectedDate){const box=document.getElementById('sgpmarket');if(!box)return;try{const lines=(await playbookLines(selectedSport)).filter(x=>correctDay(x,selectedDate)&&x.lines?.moneyline);if(!box.isConnected||tab!=='sgp'||sport!==selectedSport)return;const ranked=lines.map(x=>{const a=implied(x.lines.moneyline.away),h=implied(x.lines.moneyline.home);const fav=h>=a?'home':'away';return{item:x,fav,percent:a!=null&&h!=null?Math.round((Math.max(a,h)/(a+h))*100):null}}).filter(x=>x.percent!=null).sort((a,b)=>b.percent-a.percent).slice(0,3);box.innerHTML='<div class="eyebrow">Market research · '+esc(selectedDate)+'</div><h3>Three strongest moneyline anchors</h3><p class="tiny">Market-implied shares after removing two-way vig. These are NOT SportsLab confidence scores or completed SGPs.</p>'+(ranked.length?ranked.map((x,i)=>{const g=x.item,team=x.fav==='home'?g.homeTeamName:g.awayTeamName,price=g.lines.moneyline[x.fav];return '<div class="rank"><div class="num">'+(i+1)+'</div><div style="flex:1"><strong>'+esc(g.awayTeamName)+' @ '+esc(g.homeTeamName)+'</strong><small>'+esc(team)+' ML '+esc(amPrice(price))+' · total '+esc(g.lines.total??'—')+'</small><p class="tiny">Market-implied share: '+esc(x.percent)+'%. Evaluate correlated player volume and safer alternate lines separately before constructing an SGP.</p></div></div>'}).join(''):'<p class="tiny">No game markets matched this date. No SGP can be validated.</p>')+'<div class="note">Playbook aggregate markets only; not verified bet365. SportsLab cannot calculate a sportsbook SGP payout without exact player prop legs and combined prices. No SGP is published as a bet.</div>'}catch(e){box.innerHTML='<strong>Playbook game markets unavailable</strong><p class="tiny">No unverified SGPs will be published.</p>'}}
async function loadReview(selectedSport){const box=document.getElementById('recent-results');if(!box)return;const end=new Date(day());const dates=[1,2,3].map(days=>{const d=new Date(end);d.setDate(d.getDate()-days);return iso(d)});try{const responses=await Promise.all(dates.map(date=>fetch('/api/games?sport='+selectedSport+'&date='+date).then(r=>r.ok?r.json():{games:[],date})));if(!box.isConnected||sport!==selectedSport||tab!=='review')return;const finished=responses.flatMap((p,i)=>(p.games||[]).filter(g=>g.state==='post').map(g=>({...g,reviewDate:dates[i]}))).slice(0,24);box.innerHTML='<h3>Recent verified final scores</h3>'+(finished.length?finished.map(g=>'<div class="detailrow"><span>'+esc(g.reviewDate)+' · '+esc(g.away.short||g.away.name)+' @ '+esc(g.home.short||g.home.name)+'</span><strong>'+esc(g.away.score??'—')+' – '+esc(g.home.score??'—')+'</strong></div>').join(''):'<p class="tiny">No completed matches returned in the previous three days.</p>')+'<p class="tiny">Source: ESPN. Final scores verify game results, not unpublished player props or SGPs.</p>'}catch(e){box.innerHTML='<p class="tiny">Could not retrieve previous final scores.</p>'}}


const hawkSlateCache=new Map(),hawkOddsCache=new Map();
async function hawkSlate(s,date){const k=s+date,c=hawkSlateCache.get(k);if(c&&Date.now()-c.when<240000)return c.games;const r=await fetch('/api/statshawk-slate?league='+encodeURIComponent(s.toLowerCase())+'&date='+encodeURIComponent(date));const p=await r.json();if(!r.ok||!p.available)throw Error(p.error||'StatsHawk schedule unavailable');const games=(p.games||[]).filter(x=>x.home_team_name&&x.away_team_name&&x.status!=='postponed'&&x.status!=='cancelled'&&etDate(x.kickoff)===date);const unique=new Map();for(const g of games){const k=cleanTeam(g.home_team_name)+':'+cleanTeam(g.away_team_name);if(!unique.has(k)||g.location?.venue_name&&!unique.get(k).location?.venue_name)unique.set(k,g)}const filtered=[...unique.values()];hawkSlateCache.set(k,{when:Date.now(),games:filtered});return filtered}
async function hawkOdds(contest){const c=hawkOddsCache.get(contest);if(c&&Date.now()-c.when<90000)return c.data;const r=await fetch('/api/statshawk-slate?mode=odds&contest='+encodeURIComponent(contest));const p=await r.json();if(!r.ok||!p.available)throw Error(p.error||'No supported sportsbook board');hawkOddsCache.set(contest,{when:Date.now(),data:p});return p}
function niceMarket(k){return({'receiving.rec':'Receptions','rec':'Receptions','receiving.yards':'Receiving yards','rushing.yards':'Rushing yards','passing.yards':'Passing yards','passing.att':'Pass attempts','rushing.att':'Rush attempts','sog':'Shots on goal','pts':'Points','goals':'Goals','assists':'Assists','pitching.so':'Pitcher strikeouts','outs':'Pitcher outs','pitching.h':'Hits allowed','pitching.bb':'Pitcher walks','batting.h':'Hits','batting.hr':'Home runs','total_bases':'Total bases','er':'Earned runs'})[k]||String(k||'').replaceAll('.',' ')}
function quoteDate(t){if(!t)return 'Time unavailable';const d=new Date(t);return Number.isFinite(d.valueOf())?d.toLocaleString('en-CA',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/Toronto'})+' ET':'Time unavailable'}
function bookOffer(e){return '<span class="offer-price">'+esc(e.book)+' '+esc(amPrice(e.price))+(e.point!==null?' · '+esc(e.point):'')+'</span>'}
function bookRank(book){return book==='bet365'?0:book==='DraftKings'?1:book==='FanDuel'?2:9}
function selectQuotedProps(p){const offers=(p.preferredOffers||[]).filter(x=>x.market==='player_prop'&&x.period==='full'&&x.subject?.kind==='person'&&x.subject.name&&Number.isFinite(Number(x.point))&&(x.outcome?.kind==='over'||x.outcome?.kind==='under')).sort((a,b)=>bookRank(a.book)-bookRank(b.book));const combined=new Map();for(const o of offers){const k=o.subject.id+':'+o.measure+':'+o.point;if(!combined.has(k))combined.set(k,{subject:o.subject,measure:o.measure,point:o.point,book:o.book,over:null,under:null});const c=combined.get(k);if(!c[o.outcome.kind])c[o.outcome.kind]=o}return [...combined.values()].sort((a,b)=>bookRank(a.book)-bookRank(b.book)||String(a.subject.name).localeCompare(String(b.subject.name)))}
async function showVerifiedGameOdds(card,selectedSport,selectedDate){const box=card.querySelector('.sportsbookfeed');if(!box)return;box.innerHTML='<strong>Checking sportsbook-specific lines…</strong>';try{const games=await hawkSlate(selectedSport,selectedDate),away=card.dataset.away,home=card.dataset.home;const found=games.find(x=>cleanTeam(x.home_team_name)===cleanTeam(home)&&cleanTeam(x.away_team_name)===cleanTeam(away));if(!found){box.innerHTML='<strong>Bookmaker feed</strong><p class="tiny">No matching StatsHawk contest. Use labeled Playbook aggregate lines above.</p>';return}const p=await hawkOdds(found.id);if(!box.isConnected)return;const quotes=(p.preferredOffers||[]).filter(x=>x.period==='full'&&['h2h','spreads','totals'].includes(x.market));if(!quotes.length){box.innerHTML='<strong>Bookmaker feed</strong><p class="tiny">No bet365, DraftKings or FanDuel prices posted for this game. Playbook aggregate markets may still be available.</p>';return}box.innerHTML='<strong>Bookmaker quotes · bet365 → DraftKings → FanDuel</strong><p class="tiny">Exact posted sportsbook and quote timestamp. Not a promise a price is still available.</p>'+quotes.map(q=>'<div class="detailrow"><span>'+esc(q.market==='h2h'?'Moneyline':q.market==='spreads'?'Spread':'Game total')+' · '+esc(q.outcome?.name||q.outcome?.kind||'')+(q.point!==null?' '+esc(q.point):'')+'</span><span>'+esc(q.book)+' '+esc(amPrice(q.price))+'<small style="display:block">'+esc(quoteDate(q.observedAt))+'</small></span></div>').join('');const props=selectQuotedProps(p);if(props.length)box.innerHTML+='<p class="tiny">'+esc(props.length)+' additional player-prop markets available. Open the Top 10 Props tab and choose this game to view.</p>'}catch(e){box.innerHTML='<strong>Bookmaker quotes unavailable</strong><p class="tiny">Playbook aggregate odds remain labeled separately.</p>'}}
async function loadPostedGames(selectedSport,date){const card=document.getElementById('postedMarkets'),selector=document.getElementById('postedGame');if(!card||!selector)return;card.textContent='Checking sportsbook prop availability…';try{const games=await hawkSlate(selectedSport,date);if(!selector.isConnected||sport!==selectedSport||tab!=='props')return;selector.innerHTML=games.length?games.map(g=>'<option value="'+esc(g.id)+'">'+esc(g.away_team_name)+' @ '+esc(g.home_team_name)+'</option>').join(''):'<option value="">No games today</option>';selector.onchange=()=>loadPostedMarkets(selectedSport,selector.value);if(games.length)loadPostedMarkets(selectedSport,games[0].id);else card.innerHTML='<p class="tiny">No scheduled matchups were returned for the selected date.</p>'}catch(e){card.textContent='Bookmaker market discovery unavailable.'}}
async function loadPostedMarkets(selectedSport,contest){const box=document.getElementById('postedMarkets');if(!box||!contest)return;box.textContent='Loading bet365, DraftKings or FanDuel player offers…';try{const p=await hawkOdds(contest);if(!box.isConnected||sport!==selectedSport||tab!=='props'||document.getElementById('postedGame')?.value!==contest)return;const props=selectQuotedProps(p).slice(0,10);if(!props.length){box.innerHTML='<p class="tiny">No player props from bet365, DraftKings or FanDuel are posted in StatsHawk for this game. Historical trends below may still be available.</p>';return}box.innerHTML='<p class="tiny">Showing '+props.length+' available offers, NOT model-approved picks. Book priority: bet365, then DraftKings, then FanDuel. Quotes are recorded pregame prices; check again before betting.</p>'+props.map((q,i)=>'<div class="posted-prop"><strong>'+esc(q.subject.name)+'</strong><div class="tiny">'+esc(niceMarket(q.measure))+' · '+esc(q.point)+' line</div><div class="offer-pair">'+(q.over?'<span><b>Over</b> '+bookOffer(q.over)+'</span>':'')+(q.under?'<span><b>Under</b> '+bookOffer(q.under)+'</span>':'')+'</div><div class="tiny">Last recorded '+esc(quoteDate(q.over?.observedAt||q.under?.observedAt))+'</div><button class="analyze-quoted" data-person="'+esc(q.subject.id)+'" data-stat="'+esc(q.measure||'')+'" data-line="'+esc(q.point)+'">Check historical hit rate</button><div class="quoted-analysis tiny"></div></div>').join('');box.querySelectorAll('.analyze-quoted').forEach(b=>b.onclick=()=>analyzeQuotedOffer(b,selectedSport))}catch(e){box.innerHTML='<p class="tiny">No verified sportsbook player lines available for this game. Playbook game-level aggregate prices are separate.</p>'}}
async function analyzeQuotedOffer(button,selectedSport){const box=button.parentElement?.querySelector('.quoted-analysis');if(!box)return;const person=button.dataset.person,raw=button.dataset.stat,stat=raw==='receiving.rec'?'rec':raw;box.textContent='Checking historical results for this exact market line…';try{const r=await fetch('/api/statshawk-slate?mode=player&league='+encodeURIComponent(selectedSport.toLowerCase())+'&person_id='+encodeURIComponent(person)+'&stat='+encodeURIComponent(stat)+'&line='+encodeURIComponent(button.dataset.line));const p=await r.json();if(!r.ok||!p.available)throw Error(p.error||'No historical data');const rates=p.hitRates||{},l5=rates.last_5,l10=rates.last_10;const fmt=x=>x&&x.games?x.hits+'/'+x.games+' ('+Math.round(x.over_rate*100)+'%)':'Not enough games';box.innerHTML='<div style="border-top:1px solid #393c41;margin-top:9px;padding-top:9px"><strong>Observed over line</strong><div>Last 5: '+esc(fmt(l5))+' · Last 10: '+esc(fmt(l10))+'</div><div>Season: '+esc(fmt(rates.season))+'</div><small>Historical descriptive rates; not model confidence or a value/EV rating.</small></div>'}catch(e){box.textContent=e.message||'Historical analysis unavailable for this market.'}}

let pitchSession=null;
const pitchPalette={FF:'#f0f0f2',SI:'#34bced',SL:'#4d8cff',ST:'#8579e7',CH:'#2dc995',CU:'#f2ae59',FC:'#ee7790',KC:'#bd91fb',FS:'#ffd75d'};
function pitchLabel(id,items){return (items||[]).find(x=>x.id===id)?.name||'Unidentified player'}
function zoneVal(v,mode){if(!v)return null;return mode==='whiff'?(v.swings?v.whiffs/v.swings:null):(v.bip?v.hits/v.bip:null)}
function zoneNumber(v,mode){const n=zoneVal(v,mode);return n===null?'—':mode==='whiff'?Math.round(100*n)+'%':n.toFixed(3).replace(/^0/,'')}
function safeNum(n){return Number.isFinite(n)?n:0}
function initPitchLab(){const date=document.getElementById('pitchDate');if(!date)return;const d=new Date(day());d.setDate(d.getDate()-1);date.value=iso(d);document.getElementById('pitchLoad').onclick=()=>loadPitchGames(false);date.onchange=()=>loadPitchGames(false);document.getElementById('pitchGame').onchange=()=>fetchPitchChart();document.getElementById('pitchPitcher').onchange=()=>{pitchPopulateBatters();drawPitchChart()};document.getElementById('pitchBatter').onchange=()=>drawPitchChart();document.getElementById('pitchMetric').onchange=()=>drawPitchChart();document.getElementById('pitchKind').onchange=()=>drawPitchChart();loadPitchGames(true)}
async function loadPitchGames(auto){const input=document.getElementById('pitchDate'),select=document.getElementById('pitchGame'),out=document.getElementById('pitchStatus');if(!input||!select||!out)return;out.textContent='Checking completed games…';select.innerHTML='<option value="">Finding games…</option>';pitchSession=null;document.getElementById('pitchVis').innerHTML='';let date=input.value;for(let i=0;i<(auto?8:1);i++){try{const r=await fetch('/api/statshawk-slate?league=mlb&date='+encodeURIComponent(date));const p=await r.json();if(!input.isConnected||sport!=='MLB'||tab!=='research')return;if(r.ok&&p.available){const games=(p.games||[]).filter(x=>(x.status==='final'||x.status==='in_progress')&&x.id&&x.home_team_name&&x.away_team_name);if(games.length){input.value=date;select.innerHTML=games.map(g=>'<option value="'+esc(g.id)+'">'+esc(g.away_team_name)+' @ '+esc(g.home_team_name)+' · '+esc(g.status)+'</option>').join('');out.textContent='Game-level pitch chart · '+date+'. Select a game, pitcher and hitter.';fetchPitchChart();return}}}catch(e){}const d=new Date(date+'T12:00:00');d.setDate(d.getDate()-1);date=iso(d)}select.innerHTML='<option value="">No completed games</option>';out.textContent='No completed MLB games found. Select another date. Pitch maps appear only when recorded Statcast data is available.'}
async function fetchPitchChart(){const id=document.getElementById('pitchGame')?.value,out=document.getElementById('pitchStatus'),vis=document.getElementById('pitchVis');if(!id||!vis)return;out.textContent='Retrieving pitch-by-pitch Statcast…';vis.innerHTML='<div class="loadline"></div><div class="loadline"></div>';try{const r=await fetch('/api/statshawk-slate?mode=pitch-map&contest='+encodeURIComponent(id));const p=await r.json();if(!vis.isConnected||document.getElementById('pitchGame')?.value!==id)return;if(!r.ok||!p.available||!p.pitches?.length)throw Error(p.error||'No pitch coordinates available');pitchSession=p;document.getElementById('pitchPitcher').innerHTML=p.pitchers.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name||'Unidentified pitcher')+' · '+esc(x.count)+' pitches</option>').join('');pitchPopulateBatters();out.textContent='Real pitch-level Statcast · '+p.pitchCount+' pitches · '+p.plateAppearances+' plate appearances (this game only)';drawPitchChart()}catch(e){out.textContent=e.message||'Pitch tracking unavailable';vis.innerHTML='<p class="tiny">No pitch chart is shown without verified Statcast records.</p>'}}
function pitchPopulateBatters(){if(!pitchSession)return;const pitcher=document.getElementById('pitchPitcher')?.value,b=document.getElementById('pitchBatter');if(!b)return;const ids=new Map();for(const p of pitchSession.pitches)if(p.pitcher===pitcher)ids.set(p.batter,(ids.get(p.batter)||0)+1);b.innerHTML='<option value="all">All opposing hitters</option>'+[...ids].sort((a,b)=>b[1]-a[1]).map(([id,n])=>'<option value="'+esc(id)+'">'+esc(pitchLabel(id,pitchSession.batters))+' · '+n+' pitches</option>').join('')}
function drawPitchChart(){const d=pitchSession,box=document.getElementById('pitchVis');if(!d||!box)return;const pitcher=document.getElementById('pitchPitcher')?.value,batter=document.getElementById('pitchBatter')?.value,kind=document.getElementById('pitchKind')?.value||'all',metric=document.getElementById('pitchMetric')?.value||'avg';const filtered=d.pitches.filter(x=>x.pitcher===pitcher&&(batter==='all'||x.batter===batter)),active=filtered.filter(x=>kind==='all'||x.code===kind);const types=new Map();for(const p of filtered)types.set(p.code,(types.get(p.code)||0)+1);const kindSelect=document.getElementById('pitchKind');if(kindSelect){const prev=kindSelect.value;kindSelect.innerHTML='<option value="all">All pitch types</option>'+[...types].sort((a,b)=>b[1]-a[1]).map(([code,n])=>'<option value="'+esc(code)+'">'+esc(filtered.find(x=>x.code===code)?.type||code)+' · '+n+'</option>').join('');kindSelect.value=types.has(prev)?prev:'all'}const zones=Array.from({length:9},()=>({count:0,bip:0,hits:0,swings:0,whiffs:0}));for(const p of active){if(p.zone>=1&&p.zone<=9){const z=zones[p.zone-1];z.count++;if(p.inPlay){z.bip++;if(p.hit)z.hits++}if(p.swing){z.swings++;if(p.whiff)z.whiffs++}}}

ulate</button></div><div id="modelresult" class="tiny" style="margin-top:12px"></div></div><div id="nflmodel" style="margin-top:16px"><div class="eyebrow">NFL player prop hit-rate calculator</div><p class="tiny">Search a player by name and choose a market and line. StatsHawk historical data is descriptive, not a prediction.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="nflstat" class="statselect"><option value="rec">Receptions</option><option value="targets">Targets</option><option value="receiving.yards">Receiving yards</option><option value="rushing.yards">Rushing yards</option><option value="passing.yards">Passing yards</option><option value="rushing.att">Rushing attempts</option><option value="passing.att">Passing attempts</option><option value="intc">Interceptions thrown</option></select><input id="nflline" type="number" step=".5" min="0" value="3.5" placeholder="Over line" style="background:#22252a;color:#fff;padding:11px;border:1px solid #41454b;border-radius:10px;min-width:0"><button id="nflcalc" type="button" style="background:#a8edbd;border:0;border-radius:10px;font-weight:800;padding:11px">Calculate</button></div><div id="nflresult" class="tiny" style="margin-top:12px"></div></div></div>' ;document.getElementById('playerid').addEventListener('input',e=>{delete e.target.dataset.playerId});document.getElementById('lookup').onclick=async()=>{const input=document.getElementById('playerid'),out=document.getElementById('playerresult'),q=input.value.trim();if(/^\d{1,10}$/.test(q)){lookupPlayer();return}if(q.length<2){out.textContent='Type at least two letters of a player name.';return}out.textContent='Searching players…';try{const r=await fetch('/api/player-search?sport='+sport+'&q='+encodeURIComponent(q));if(!r.ok)throw Error('Search unavailable');const d=await r.json();if(!d.players?.length){out.textContent='No matching players found. Try their full name.';return}out.innerHTML='<p>Choose a player:</p>'+d.players.map(p=>'<button
