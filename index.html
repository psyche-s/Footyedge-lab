<style>

.gamegrid{display:grid;grid-template-columns:1fr;gap:12px}.game{margin:0}.gamehead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px}.league{font-weight:800;color:#b8e7c4;letter-spacing:.6px}.time{color:#b9bcc4}.matchup{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;margin:22px 0 17px;gap:6px}.team{display:flex;flex-direction:column;gap:6px;min-width:0}.team.right{align-items:flex-end;text-align:right}.crest{height:49px;width:49px;object-fit:contain}.fallback{height:49px;width:49px;border:1px solid #3a3d44;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#25272c}.teamname{font:800 15px Manrope;line-height:1.25;overflow-wrap:anywhere}.record{font-size:11px;color:#9da1aa}.mid{text-align:center}.vs{font:800 17px Manrope;color:#9b9ea7}.score{font:800 21px Manrope;white-space:nowrap}.matchstate{font-size:10px;color:#9298a3;margin-top:5px}.compare{display:flex;align-items:center;gap:10px;margin:10px 0 12px}.comparebar{height:5px;flex:1;border-radius:9px;background:#35383d;overflow:hidden}.comparebar span{height:100%;background:var(--green);display:block}.fact{font-size:11px;color:#c3c7cf;background:#1d1f23;border-radius:10px;padding:10px 11px;line-height:1.6}.fact b{color:#fff}.gamefoot{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#18191d;border-top:1px solid #2b2d33;padding:12px 16px;font-size:11px;color:#a3a7b1}.detailbtn{background:none;border:0;color:var(--green);font-weight:800;font-size:11px}.detail{display:none;border-top:1px solid var(--line);padding:15px}.game.open .detail{display:block}.detail h3{font:800 14px Manrope;margin:3px 0 14px}.detailrow{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #292b30;padding:10px 0;font-size:12px}.detailrow span:last-child{text-align:right;color:#d5d8df}.metricbox{background:#1a1c20;border-radius:12px;padding:12px;margin:10px 0}.metricbox strong{font-size:12px}.metricbox p{font-size:11px;color:#aeb3bd;line-height:1.6;margin:5px 0 0}.blank{text-align:center;padding:45px 20px;color:#a1a5af}.blank .symbol{font-size:31px;color:var(--green);margin-bottom:10px}.blank strong{display:block;color:#f2f3f5;font-size:15px;margin-bottom:8px}.blank p{font-size:12px;line-height:1.7;max-width:360px;margin:0 auto}.rank{display:flex;align-items:center;gap:12px;border-top:1px solid #292c31;padding:17px 0}.num{font:800 21px Manrope;color:var(--green);min-width:28px}.rank strong{font-size:13px}.rank small{display:block;color:#9297a2;font-size:11px;margin-top:5px;line-height:1.5}.tag{margin-left:auto;white-space:nowrap;background:#26282d;color:#a9adb7;font-size:10px;border-radius:9px;padding:6px 8px}.note{border:1px solid #353a38;border-radius:12px;background:#171c19;padding:12px 14px;font-size:11px;line-height:1.7;color:#bfcfc5}.note strong{color:#e3f3e6}.modelgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modelgrid div{padding:13px;background:#1b1d21;border:1px solid #303238;border-radius:12px;font-size:12px;line-height:1.5}.modelgrid span{display:block;color:#a8edbd;font-size:10px;margin-bottom:5px;font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#111215f5;border-top:1px solid #31333a;display:flex;justify-content:space-around;padding:10px 0 max(13px,env(safe-area-inset-bottom));backdrop-filter:blur(18px)}.bottom button{border:0;background:none;color:#9da1aa;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;min-width:65px}.bottom button b{font-size:20px;font-weight:500}.bottom button.active{color:#b5edc5}footer{font-size:10px;line-height:1.8;color:#858b95;margin:22px 4px} .loadline{height:12px;background:linear-gradient(90deg,#1d1f23,#303238,#1d1f23);background-size:200%;animation:shine 1.4s linear infinite;border-radius:8px;margin:14px 0}@keyframes shine{to{background-position:-200% 0}}@media(min-width:740px){main{padding:22px 24px 120px}.gamegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom{max-width:960px;left:50%;transform:translateX(-50%)}.modelgrid{grid-template-columns:repeat(3,1fr)}}
</style></head>

<script>
let sport='NHL',tab='games',offset=0,serial=0;const base=new Date();base.setHours(12,0,0,0);const cache=new Map();
const dailyResearch={date:'2026-10-08',NHL:[{player:'Nathan MacKinnon',market:'4+ shots on goal',odds:'-130',book:'DraftKings',game:'COL @ CGY',note:'Cleared in 2 of 3 early games; 7.6 attempts/game. Calgary allows high center shot volume; previous three meetings also cleared. Small 2026 sample.',url:'https://dknetwork.draftkings.com/2026/10/08/best-nhl-player-props-today-for-thursday-october-8/',grade:'Research candidate'},{player:'Tim Stützle',market:'1+ assist',odds:'-105',book:'DraftKings',game:'PHI @ OTT',note:'Three assists through three games; leads Ottawa forwards in ice time. Flyers struggling against high-danger chances. Assist outcomes remain volatile.',url:'https://dknetwork.draftkings.com/2026/10/08/best-nhl-player-props-today-for-thursday-october-8/',grade:'Research candidate'},{player:'Rasmus Dahlin',market:'Over 1.5 shots on goal',odds:'-115',book:'Action Network listing',game:'DAL @ BUF',note:'Published line and price visible in a third-party odds comparison; independent shot logs and current role still need confirmation.',url:'https://www.actionnetwork.com/nhl/props',grade:'Needs validation'},{player:'Jack Eichel',market:'2+ points',odds:'+165',book:'DraftKings',game:'TOR @ VGK',note:'Ten points in four games, 2+ points in three. Toronto has allowed high-danger chances; high-variance multi-point market.',url:'https://dknetwork.draftkings.com/2026/10/08/best-nhl-player-props-today-for-thursday-october-8/',grade:'Higher variance'}],NFL:[{player:'Dak Prescott',market:'Over 2.5 passing TDs',odds:'+160',book:'Odds comparison',game:'TB @ DAL',note:'Listed market moved from 1.5 to 2.5; a materially harder threshold. Tampa Bay injuries require context; do not use as a safe parlay leg.',url:'https://www.probetrics.com/',grade:'Higher variance'},{player:'Chris Godwin Jr.',market:'Over 3.5 receptions',odds:'-120',book:'Odds comparison',game:'TB @ DAL',note:'Reported market move from 2.5 to 3.5. Baker Mayfield listed OUT on official NFL injury report; quarterback change creates role uncertainty.',url:'https://www.probetrics.com/',grade:'Needs validation'}],MLB:[{player:'Parker Messick',market:'Over 6.5 strikeouts',odds:'+134',book:'FanDuel',game:'CLE @ CHW',note:'2026 season ERA 2.56, WHIP 1.063; strikeout profile and Chicago lineup strikeout tendency support investigation, but 7+ Ks is a demanding threshold.',url:'https://talksport.com/us/4632061/mlb-prop-bets-october-8-2026/',grade:'Higher variance'},{player:'Steven Kwan',market:'Under 0.5 hits',odds:'+165',book:'BetMGM',game:'CLE @ CHW',note:'Reported .154 playoff average in three games; no-hit props are volatile and need lineup/plate appearance checks.',url:'https://talksport.com/us/4632061/mlb-prop-bets-october-8-2026/',grade:'Higher variance'}]};
const model={NHL:[['PLAYER SHOT PROFILE','SOG, shot attempts, individual shot share, L5/L10, season and prior-season floor'],['DEFENSE BY POSITION','Opponent shots and scoring chances allowed to centers, wings and defensemen'],['MATCHUP HISTORY','H2H shot floor and ceiling, last season, home/away and strength of opponents'],['CURRENT ROLE','TOI, even-strength line, power-play unit, shifts and recent role changes'],['ON-ICE CONTEXT','Plus/minus, on-ice goal differential, defensive usage and teammates'],['GAME ENVIRONMENT','Opponent pace, goalie, back-to-back fatigue, projected lines and injuries'],['MARKET QUALITY','Exact SOG/points/assists line, odds, alternative lines and stability'],['SGP CORRELATION','Shared game script, shot opportunity and dependence between legs']],NFL:[['PLAYER OPPORTUNITY','Targets, routes, snaps, carries, air yards, L5/L10 and prior season'],['DEFENSE BY POSITION','Targets, receptions, yards and TDs allowed to WR1/WR2, TE and RB'],['MATCHUP HISTORY','H2H, last-season defensive personnel and scheme changes'],['GAME SCRIPT','Spread, pace, pass rate, coverage, pressure and likely play volume'],['ROLE AND AVAILABILITY','Depth chart, injuries, QB status, red-zone and third-down usage'],['MARKET QUALITY','Receptions vs yards, passing attempts, alt lines and current odds'],['SGP CORRELATION','QB/receiver, rushing/game script and TD dependencies']],MLB:[['BASEBALL SAVANT','Statcast xwOBA, hard-hit, barrel, whiff, chase and pitch mix'],['STARTER PROFILE','Pitch count, outs, Ks, walks, hits, earned runs and early-pull risk'],['MATCHUP SPLITS','Pitch type and handedness, batter performance and projected lineup'],['OPPONENT TRENDS','Strikeout, walk, run and hit rates versus starter profile'],['HISTORY AND FORM','L3/L5/L10 starts, season, prior season, H2H with sample size'],['GAME CONDITIONS','Ballpark, weather, umpire where verified and bullpen fatigue'],['MARKET QUALITY','Exact K/outs/ER/walk/hits/NRFI lines, prices and alternatives'],['SGP CORRELATION','Pitcher outs, runs, Ks and team totals dependencies']]};
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function day(){const d=new Date(base);d.setDate(d.getDate()+offset);return d}
function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function logo(t){const url=t.logo||'';return /^https:\/\/[a-z0-9.-]+\/[^"'<>]*$/i.test(url)?'<img class="crest" alt="" loading="lazy" src="'+esc(url)+'">':'<div class="fallback">'+esc(t.abbreviation||'?')+'</div>'}
function gameHTML(g){const a=g.away,h=g.home;const time=new Date(g.date).toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit',timeZone:'America/Toronto'});const live=g.state!=='pre';const center=live?esc(a.score??'–')+' : '+esc(h.score??'–'):'VS';const status=live?esc(g.detail||g.status):time+' ET';const name=t=>esc(t.short||t.name||t.abbreviation);return '<article class="card game" data-game="'+esc(g.id)+'"><div class="inner"><div class="gamehead"><span class="league">'+esc(sport)+' · '+esc(g.status)+'</span><span class="time">'+esc(status)+'</span></div><div class="matchup"><div class="team">'+logo(a)+'<div class="teamname">'+name(a)+'</div><span class="record">'+esc(a.record||'Away')+'</span></div><div class="mid"><div class="'+(live?'score':'vs')+'">'+center+'</div><div class="matchstate">'+(live?'Scoreboard':'Scheduled')+'</div></div><div class="team right">'+logo(h)+'<div class="teamname">'+name(h)+'</div><span class="record">'+esc(h.record||'Home')+'</span></div></div><div class="fact"><b>Matchup snapshot</b> · '+(a.record&&h.record?'Team records: '+esc(a.record)+' vs '+esc(h.record)+'.':'Pre-game team form awaiting verification.')+' Detailed player-level analysis will appear once validated.</div></div><div class="gamefoot"><span>'+esc(g.venue||'Venue not listed')+'</span><button class="detailbtn" aria-expanded="false" type="button">View analysis ↓</button></div><div class="detail"><h3>Matchup analysis</h3><div class="detailrow"><span>Game status</span><span>'+esc(g.status)+'</span></div><div class="detailrow"><span>Away record</span><span>'+esc(a.record||'Unavailable')+'</span></div><div class="detailrow"><span>Home record</span><span>'+esc(h.record||'Unavailable')+'</span></div><div class="detailrow"><span>Venue</span><span>'+esc(g.venue||'Unavailable')+'</span></div><div class="metricbox researchfeed"><strong>Verified game research</strong><p>Open this card to retrieve available team and player box-score data. Pregame statistics and sportsbook prices are not yet integrated.</p></div></div></article>'}
async function loadStatBoard(s,date){const box=document.getElementById('live-statboard');if(!box)return;try{const r=await fetch('/api/stat-board?league='+s.toLowerCase()+'&date='+date);const p=await r.json();if(!r.ok||!p.available){box.innerHTML='<strong>Live historical slate board</strong><p class="tiny">'+esc(p.reason||'Provider data unavailable')+'. Existing research candidates above are not verified bet365 odds.</p>';return}box.innerHTML='<strong>Live historical slate board · '+esc(date)+'</strong><p class="tiny">Observed last-10 rates only. No verified bet365 prices; no model-approved bets.</p>'+(p.picks||[]).map(x=>'<div class="detailrow"><span>'+esc(x.player)+' · '+esc(x.opponent||'')+'</span><span>'+esc(x.stat)+' · '+esc(Math.round(x.observedLast10Rate*100))+'% in '+esc(x.sample)+' games</span></div>').join('')+(p.picks?.length?'':'<p class="tiny">No qualifying observed-rate candidates today.</p>')}catch(e){box.textContent='Live research board temporarily unavailable.'}}
function render(){async function calculateMLB(){const out=document.getElementById('mlbresult'),id=(document.getElementById('playerid').dataset.playerId||document.getElementById('playerid').value.trim()),metric=document.getElementById('mlbmetric').value,line=document.getElementById('mlbline').value,opp=document.getElementById('mlbopp').value.trim();if(!/^\d{1,10}$/.test(id)){out.textContent='Enter a valid MLB player ID first.';return}out.textContent='Calculating MLB historical rates…';try{const r=await fetch('/api/mlb-model?player='+encodeURIComponent(id)+'&metric='+encodeURIComponent(metric)+'&line='+encodeURIComponent(line)+'&opponent='+encodeURIComponent(opp));if(!r.ok)throw Error('Source unavailable');const p=await r.json(),fmt=x=>x.sample?esc(x.hits)+'/'+esc(x.sample)+' ('+esc(x.hitRate)+'%) · avg '+esc(x.average):'No sample';out.innerHTML='<strong>'+esc(metric)+' ≥ '+esc(line)+'</strong>'+[['Last 5',p.last5],['Last 10',p.last10],['Current season',p.currentSeason],['Prior season',p.priorSeason],['H2H',p.headToHead]].filter(x=>x[1]).map(x=>'<div class="detailrow"><span>'+esc(x[0])+'</span><span>'+fmt(x[1])+'</span></div>').join('')+'<p>Historical rates only. No opponent-adjusted projections or verified odds.</p>'}catch(e){out.textContent='MLB statistics unavailable. Check player ID or try again later.'}}
async function calculateNHL(){const out=document.getElementById('modelresult'),id=(document.getElementById('playerid').dataset.playerId||document.getElementById('playerid').value.trim()),metric=document.getElementById('metric').value,line=document.getElementById('line').value,opp=document.getElementById('opponent').value.trim().toUpperCase();if(!/^\d{1,10}$/.test(id)){out.textContent='Enter a valid NHL player ID first.';return}out.textContent='Calculating from NHL game logs…';try{const r=await fetch('/api/nhl-model?player='+encodeURIComponent(id)+'&metric='+encodeURIComponent(metric)+'&line='+encodeURIComponent(line)+'&opponent='+encodeURIComponent(opp)+'&sport=NHL');if(!r.ok)throw Error('Unavailable');const p=await r.json();const fmt=x=>x.sample?esc(x.hits)+'/'+esc(x.sample)+' ('+esc(x.hitRate)+'%) · avg '+esc(x.average):'No sample';out.innerHTML='<strong>'+esc(metric)+' ≥ '+esc(line)+' · descriptive hit rates</strong>'+[['Last 5',p.last5],['Last 10',p.last10],['Current season',p.currentSeason],['Previous season',p.priorSeason],['H2H vs '+opp,p.headToHead]].filter(x=>x[1]).map(x=>'<div class="detailrow"><span>'+esc(x[0])+'</span><span>'+fmt(x[1])+'</span></div>').join('')+'<p>Observed rates are not betting probabilities. Matchup allowances, injuries and sportsbook odds are not included in this calculation.</p>'}catch(e){out.textContent='Historical model unavailable. Try again later.'}}
async function lookupPlayer(){const id=(document.getElementById('playerid')?.dataset.playerId||document.getElementById('playerid')?.value.trim()),out=document.getElementById('playerresult');if(!/^\d{1,10}$/.test(id)){out.textContent='Enter a valid numeric player ID.';return}if(sport==='NFL'){out.textContent='NFL individual player lookup is not connected yet.';return}out.textContent='Loading official player statistics…';try{const r=await fetch('/api/'+(sport==='NHL'?'nhl-player':'mlb-player')+'?player='+encodeURIComponent(id));if(!r.ok)throw Error('Feed unavailable');const p=await r.json();if(sport==='NHL'){out.innerHTML='<strong>'+esc(p.name||id)+'</strong> · '+esc(p.position||'')+'<p>Recent games</p>'+(p.last5Games||[]).map(x=>'<div class="detailrow"><span>'+esc(x.date)+' vs '+esc(x.opponent?.default||x.opponent||'')+'</span><span>SOG '+esc(x.shots??'—')+' · +/- '+esc(x.plusMinus??'—')+' · TOI '+esc(x.toi??'—')+'</span></div>').join('')+'<p>Season history</p>'+(p.seasonTotals||[]).slice(-5).map(x=>'<div class="detailrow"><span>'+esc(x.season)+' '+esc(x.team?.default||x.team||'')+'</span><span>GP '+esc(x.gamesPlayed??'—')+' · SOG '+esc(x.shots??'—')+' · +/- '+esc(x.plusMinus??'—')+'</span></div>').join('')}else{out.innerHTML='<strong>MLB official player log</strong>'+(p.groups||[]).map(g=>'<p>'+esc(g.type)+' · '+esc(g.group)+'</p>'+(g.splits||[]).slice(-5).map(x=>'<div class="detailrow"><span>'+esc(x.date||x.season||'')+'</span><span>'+esc(JSON.stringify(x.stat||{}).slice(0,170))+'</span></div>').join('')).join('')}if(!out.innerHTML.trim())out.textContent='No player statistics returned.'}catch(e){out.textContent='Unable to retrieve official player statistics. Check the ID and try again.'}}
async function loadResearch(card,selectedSport){const area=card.querySelector('.researchfeed');if(area.dataset.loaded)return;area.dataset.loaded='loading';area.innerHTML='<strong>Loading verified statistics…</strong>';try{const r=await fetch('/api/research?sport='+encodeURIComponent(selectedSport)+'&id='+encodeURIComponent(card.dataset.game));if(!r.ok)throw Error('Research unavailable');const p=await r.json();let out='<strong>Verified game statistics</strong><p>Source: '+esc(p.source)+' · '+esc(new Date(p.fetchedAt).toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit',timeZone:'America/Toronto'}))+' ET</p>';for(const team of p.teams||[]){out+='<h3>'+esc(team.team)+'</h3>';for(const stat of team.statistics.slice(0,12))out+='<div class="detailrow"><span>'+esc(stat.name)+'</span><span>'+esc(stat.value)+'</span></div>'}for(const group of p.players||[]){out+='<h3>'+esc(group.team)+' — player box score</h3>';for(const cat of group.categories.slice(0,3)){out+='<p>'+esc(cat.name)+'</p>';for(const a of cat.athletes.slice(0,8))out+='<div class="detailrow"><span>'+esc(a.name)+'</span><span>'+esc(a.stats.join(' / '))+'</span></div>';if(cat.labels.length)out+='<p>Stat order: '+esc(cat.labels.join(' / '))+'</p>'}}if(!(p.teams?.length||p.players?.length))out+='<p>No box-score statistics available yet. This is normal before puck drop, kickoff or first pitch.</p>';area.innerHTML=out;area.dataset.loaded='yes'}catch(e){area.innerHTML='<strong>Research unavailable</strong><p>The verified game summary could not be retrieved. No statistics were inferred.</p>';area.dataset.loaded=''}}
document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('active',b.dataset.s===sport));document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===tab));const root=document.getElementById('content');if(tab==='games'){const d=day();root.innerHTML='<div class="datebar"><button class="arrow" id="prev" aria-label="Previous day">‹</button><div class="datecenter"><strong>'+esc(d.toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric',year:'numeric'}))+'</strong><div>'+(offset===0?'<button class="today" id="today">Today</button>':'<button class="today" id="today">Go to today</button>')+'<span id="gamecount" class="count">Loading</span></div></div><button class="arrow" id="next" aria-label="Next day">›</button></div><div class="heading"><h2>'+sport+' games</h2><span class="tiny" id="source">Fetching scoreboard…</span></div><div id="games" class="gamegrid"><div class="card inner"><div class="loadline"></div><div class="loadline"></div><div class="loadline"></div></div></div>';document.getElementById('prev').onclick=()=>{offset--;render()};document.getElementById('next').onclick=()=>{offset++;render()};document.getElementById('today').onclick=()=>{offset=0;render()};loadGames(sport,iso(d));return}serial++;if(tab==='sgp'){root.innerHTML='<div class="heading"><h2>Top 3 '+sport+' SGPs</h2><span class="tiny">Risk-adjusted</span></div><div class="card inner"><div class="note"><strong>Publication rule:</strong> exact sportsbook prices, correlation-adjusted combined odds, a consistent game script and safer-line comparisons must be verified. Weak slates may have zero picks.</div>'+[1,2,3].map(n=>'<div class="rank"><div class="num">'+n+'</div><div><strong>SGP candidate</strong><small>Verified legs and correlated pricing not yet available</small></div><span class="tag">Not published</span></div>').join('')+'</div>'}else if(tab==='props'){const items=iso(day())===dailyResearch.date?dailyResearch[sport]:[];root.innerHTML='<div class="heading"><h2>'+sport+' prop research</h2><span class="tiny">'+items.length+' candidates · '+esc(iso(day()))+'</span></div><div class="card inner"><div class="note"><strong>Research watchlist, not model-approved bets.</strong> These lines were published by third parties on October 8, 2026. Prices can change. We have not independently verified live sportsbook availability or calculated full model hit rates; no confidence percentage is assigned.</div>'+ (items.length?items.map((p,i)=>'<div class="rank" style="align-items:flex-start"><div class="num">'+(i+1)+'</div><div style="min-width:0;flex:1"><strong>'+esc(p.player)+' — '+esc(p.market)+'</strong><small>'+esc(p.game)+' · '+esc(p.book)+' · '+esc(p.odds)+' · '+esc(p.grade)+'</small><p style="font-size:12px;line-height:1.7;color:#c5c8d0">'+esc(p.note)+'</p><a href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer" style="font-size:11px;color:#a8edbd">Source and price context ↗</a></div></div>').join(''):'<div class="blank">No verified research candidates for this date.</div>')+'<div id="live-statboard" class="card inner"><strong>Live historical slate board</strong><p class="tiny">Loading current observed hit rates. These are research signals, not approved bets. Bet365 odds are not verified.</p></div></div>';loadStatBoard(sport,iso(day()))}else if(tab==='research'){root.innerHTML='<div class="heading"><h2>'+sport+' research model</h2><span class="tiny">Evidence framework</span></div><div class="card inner"><p class="muted" style="line-height:1.7;font-size:12px;margin-top:0">These are the checks performed before evaluating props and SGP legs. Live player-level statistics and odds integration are still in development.</p><div class="modelgrid">'+model[sport].map(([h,b])=>'<div><span>'+esc(h)+'</span>'+esc(b)+'</div>').join('')+'</div></div><div class="card inner"><h3 style="margin-top:0">Live player stat lookup</h3><p class="tiny">Search by player name. Choose a result to load official statistics and calculate historical hit rates.</p><div style="display:flex;gap:8px"><input id="playerid" placeholder="Search player name (e.g. Connor McDavid)" style="background:#22252a;border:1px solid #41454b;border-radius:10px;padding:12px;color:#fff;min-width:0;flex:1"><button id="lookup" style="border:0;border-radius:10px;background:#a8edbd;color:#111;padding:10px 16px;font-weight:800">Look up</button></div><div id="playerresult" class="tiny" style="margin-top:12px"></div><div id="mlbmodel" style="margin-top:16px"><div class="eyebrow">MLB historical hit-rate calculator</div><p class="tiny">Select a player above. Historical rates are not projections or betting probabilities.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="mlbmetric" style="background:#22252a;color:white;padding:11px;border-radius:10px"><option value="strikeOuts">Pitcher strikeouts</option><option value="earnedRuns">Earned runs</option><option value="walksAllowed">Pitcher walks</option><option value="hitsAllowed">Hits allowed</option><option value="hits">Batter hits</option><option value="totalBases">Total bases</option><option value="homeRuns">Home runs</option><option value="rbi">RBIs</option></select><input id="mlbline" type="number" min="0" step=".5" value="2" style="background:#22252a;color:white;padding:11px;border-radius:10px;min-width:0"><input id="mlbopp" placeholder="Opponent MLB team ID (optional)" style="background:#22252a;color:white;padding:11px;border-radius:10px;min-width:0"><button id="mlbcalc" style="background:#a8edbd;border:0;border-radius:10px;font-weight:800">Calculate</button></div><div id="mlbresult" class="tiny" style="margin-top:12px"></div></div><div id="nhlmodel" style="margin-top:16px"><div class="eyebrow">NHL line-specific hit rates</div><p class="tiny">Select a player above, then choose a line threshold and optional opponent abbreviation for observed L5, L10, previous-season and H2H rates.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="metric" style="background:#22252a;border:1px solid #41454b;border-radius:10px;padding:11px;color:#fff"><option value="shots">Shots on goal</option><option value="points">Points</option><option value="goals">Goals</option><option value="assists">Assists</option><option value="plusMinus">Plus/minus</option></select><input id="line" type="number" step=".5" value="2" placeholder="Threshold" style="background:#22252a;border:1px solid #41454b;border-radius:10px;padding:11px;color:#fff;min-width:0"><input id="opponent" maxlength="3" placeholder="Opponent e.g. TOR" style="background:#22252a;border:1px solid #41454b;border-radius:10px;padding:11px;color:#fff;min-width:0"><button id="calculate" style="border:0;border-radius:10px;background:#a8edbd;color:#111;font-weight:800">Calculate</button></div><div id="modelresult" class="tiny" style="margin-top:12px"></div></div></div>' ;document.getElementById('playerid').addEventListener('input',e=>{delete e.target.dataset.playerId});document.getElementById('lookup').onclick=async()=>{const input=document.getElementById('playerid'),out=document.getElementById('playerresult'),q=input.value.trim();if(/^\\d{1,10}$/.test(q)){lookupPlayer();return}if(q.length<2){out.textContent='Type at least two letters of a player name.';return}out.textContent='Searching players…';try{const r=await fetch('/api/player-search?sport='+sport+'&q='+encodeURIComponent(q));if(!r.ok)throw Error('Search unavailable');const d=await r.json();if(!d.players?.length){out.textContent='No matching players found. Try their full name.';return}out.innerHTML='<p>Choose a player:</p>'+d.players.map(p=>'<button class="playerchoice" data-id="'+esc(p.id)+'" data-name="'+esc(p.name)+'" style="display:block;width:100%;margin:6px 0;padding:11px;background:#22252a;color:#fff;border:1px solid #41454b;border-radius:9px;text-align:left">'+esc(p.name)+(p.team?' · '+esc(p.team):'')+'</button>').join('');out.querySelectorAll('.playerchoice').forEach(b=>b.onclick=()=>{input.value=b.dataset.id;lookupPlayer();input.value=b.dataset.name;input.dataset.playerId=b.dataset.id})}catch(e){out.textContent='Player search is temporarily unavailable.'}};document.getElementById('nhlmodel').style.display=sport==='NHL'?'block':'none';document.getElementById('mlbmodel').style.display=sport==='MLB'?'block':'none';document.getElementById('mlbcalc').onclick=()=>calculateMLB();document.getElementById('calculate').onclick=()=>calculateNHL()}else{root.innerHTML='<div class="heading"><h2>Model review</h2><span class="tiny">Postgame learning</span></div><div class="card blank"><div class="symbol">◎</div><strong>No settled picks yet</strong><p>Published recommendations will be audited for results, reasoning quality, injuries, line changes, game-script shifts and missed safer alternatives.</p></div>'}}
async function loadGames(s,dayString){const id=++serial;const box=document.getElementById('games');const key=s+dayString;try{let data=cache.get(key);if(!data){const response=await fetch('/api/games?sport='+encodeURIComponent(s)+'&date='+encodeURIComponent(dayString));if(!response.ok)throw Error('Scoreboard unavailable');data=await response.json();cache.set(key,data)}if(id!==serial||tab!=='games'||sport!==s)return;document.getElementById('gamecount').textContent=(data.games||[]).length+' games';document.getElementById('source').textContent='ESPN · '+new Date(data.fetchedAt).toLocaleTimeString('en-CA',{hour:'numeric',minute:'2-digit',timeZone:'America/Toronto'});box.innerHTML=data.games?.length?data.games.map(gameHTML).join(''):'<div class="card blank"><div class="symbol">◇</div><strong>No games scheduled</strong><p>No '+esc(s)+' games were returned for this date. Choose another day.</p></div>';box.querySelectorAll('.detailbtn').forEach(b=>b.onclick=()=>{const c=b.closest('.game');c.classList.toggle('open');b.setAttribute('aria-expanded',c.classList.contains('open'));b.textContent=c.classList.contains('open')?'Hide analysis ↑':'View analysis ↓';if(c.classList.contains('open'))loadResearch(c,sport)})}catch(e){if(id===serial&&tab==='games'&&sport===s){document.getElementById('gamecount').textContent='Unavailable';document.getElementById('source').textContent='Feed offline';box.innerHTML='<div class="card blank"><div class="symbol">◇</div><strong>Games temporarily unavailable</strong><p>The public scoreboard could not be loaded. Please retry later; we do not show invented fixtures.</p></div>'}}}
document.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{sport=b.dataset.s;render()}));document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.t;render()}));render();
