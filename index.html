<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08110e"><title>FootyEdge Lab — Sports Intelligence</title><style>:root{color-scheme:dark;--bg:#08110e;--panel:#112019;--panel2:#172a20;--line:#2a4435;--muted:#9bb4a5;--green:#61e4a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f0f7f2;font:14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}button{font:inherit;cursor:pointer}header{position:sticky;top:0;z-index:4;background:#0d1a14eF;border-bottom:1px solid var(--line)}.top{max-width:900px;margin:auto;padding:16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:17px;font-weight:850;letter-spacing:.05em}.green{color:var(--green)}.pill{color:#a5d7b7;background:#1b3929;border:1px solid #2b6042;padding:5px 9px;border-radius:99px;font-size:11px}main{max-width:900px;margin:auto;padding:16px 14px 100px}.sports,.tabs{display:flex;gap:8px;overflow-x:auto;padding:5px 0 10px;scrollbar-width:none}.sports button,.tabs button{white-space:nowrap;border:1px solid var(--line);background:#15241c;color:#a9c0b0;border-radius:12px;padding:11px 18px;font-weight:650}.sports button.active,.tabs button.active{color:#07140d;background:var(--green);border-color:var(--green)}.datebar{display:flex;align-items:center;justify-content:space-between;padding:18px 0}.datebar button{background:#1b3025;border:1px solid var(--line);color:white;border-radius:50%;height:40px;width:40px;font-size:23px}.datebar strong{font-size:16px}.muted{color:var(--muted)}.small{font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #0002}.panel h2{font-size:17px;margin:3px 0 12px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 8px}.match{padding:0;overflow:hidden}.match .inside{padding:17px}.league{font-size:11px;font-weight:800;color:#7deda9;letter-spacing:.07em}.teams{display:grid;grid-template-columns:1fr 42px 1fr;align-items:center;gap:6px;margin:18px 0}.team{font-weight:750;font-size:17px}.team:last-child{text-align:right}.vs{text-align:center;color:#849d8d;font-weight:800}.logo{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#264633;color:#d6f6e2;margin-bottom:8px;font-weight:850}.team:last-child .logo{margin-left:auto}.bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:#335141;margin:12px 0}.bar span{background:#61e4a0;width:50%}.summary{background:#1b3024;border:1px solid #2a4c35;border-radius:9px;padding:11px;font-size:12px;line-height:1.6}.bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:13px 17px;color:var(--muted);font-size:12px}.linkbtn{border:0;background:none;color:var(--green);font-weight:750}.detail{display:none;border-top:1px solid var(--line);padding:15px 17px}.match.open .detail{display:block}.metric{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #294234}.metric span:last-child{text-align:right;color:#c6dfcf}.placeholder{padding:28px 15px;text-align:center;color:var(--muted)}.rank{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:17px 0}.number{font-size:23px;font-weight:850;color:var(--green);min-width:25px}.grow{flex:1}.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#112019f5;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:11px 0 max(14px,env(safe-area-inset-bottom));z-index:6}.bottomnav button{border:0;background:none;color:#91ac9b;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}.bottomnav button.active{color:var(--green)}.bottomnav b{font-size:19px}input[type=date]{background:#193023;color:white;border:1px solid var(--line);border-radius:8px;padding:6px}footer{color:#728b7b;font-size:11px;line-height:1.6;margin:22px 0}@media(min-width:700px){.matches{display:grid;grid-template-columns:1fr 1fr;gap:14px}.match{margin:0}.bottomnav{left:calc(50% - 450px);right:calc(50% - 450px);border-left:1px solid var(--line);border-right:1px solid var(--line)}}</style></head><body><header><div class="top"><div class="brand">◆ FOOTYEDGE <span class="green">LAB</span></div><span class="pill">FREE RESEARCH</span></div></header><main><div class="sports" id="sports"><button data-s="NHL" class="active">🏒 NHL</button><button data-s="NFL">🏈 NFL</button><button data-s="MLB">⚾ MLB</button></div><div class="tabs" id="tabs"><button data-t="games" class="active">Games</button><button data-t="sgp">Top 3 SGPs</button><button data-t="props">Top 10 Props</button><button data-t="review">Model Review</button></div><div id="content"></div><footer>Stats and odds must be sourced and verified before a recommendation is published. No guaranteed picks. Gamble responsibly.</footer></main><nav class="bottomnav" id="bottom"><button data-t="games" class="active"><b>▦</b>Games</button><button data-t="sgp"><b>✦</b>SGPs</button><button data-t="props"><b>◈</b>Props</button><button data-t="review"><b>▤</b>Review</button></nav><script>let sport='NHL',tab='games',offset=0;const base=new Date();base.setHours(12,0,0,0);const models={NHL:['Shots on goal and attempts','Time on ice and power-play role','Opponent shots allowed by position','Last 5/10 and prior season','Expected pace and goalie confirmation'],NFL:['Targets, routes and snap share','Carries, pass attempts and red-zone role','Opponent coverage and position allowance','Last 5/10 and injury report','Game script and offensive pace'],MLB:['Starter outs and pitch count','Strikeouts, walks, earned runs and hits','Lineup splits versus pitcher handedness','Bullpen availability and park factors','Confirmed lineup and weather']};function date(){let d=new Date(base);d.setDate(d.getDate()+offset);return d}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('active',b.dataset.s===sport));document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===tab));let root=document.getElementById('content');if(tab==='games'){let d=date();root.innerHTML='<div class="datebar"><button id="prev" aria-label="Previous day">‹</button><div style="text-align:center"><strong>'+d.toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})+'</strong><div class="muted small">'+(offset===0?'Today · ':'')+'Schedule research</div></div><button id="next" aria-label="Next day">›</button></div><div class="sectionhead"><h2>'+sport+' Games</h2><span class="pill">Feed pending</span></div><div class="panel placeholder"><div style="font-size:30px">▦</div><h2>Verified fixtures are not connected yet</h2><p>We will display each scheduled matchup here with team logos, time, matchup statistics, and expandable research. No fake fixtures or scores.</p></div><div class="panel"><h2>What each game will include</h2><div class="matches">'+models[sport].map((m,i)=>'<div class="metric"><span>'+esc(m)+'</span><span>Awaiting data</span></div>').join('')+'</div></div>';document.getElementById('prev').onclick=()=>{offset--;render()};document.getElementById('next').onclick=()=>{offset++;render()}}else if(tab==='sgp'){root.innerHTML='<div class="sectionhead"><h2>Top 3 '+sport+' SGPs</h2><span class="pill">Risk-adjusted</span></div><div class="panel"><p class="muted small">Compare verified individual lines, sportsbook odds, leg correlation, game-script fit and safer alternatives. Publish fewer than three when the evidence is weak.</p>'+[1,2,3].map(n=>'<div class="rank"><span class="number">'+n+'</span><div class="grow"><strong>SGP candidate</strong><div class="muted small">Legs, prices and matchup verification required</div></div><span class="pill">Pending</span></div>').join('')+'</div>'}else if(tab==='props'){root.innerHTML='<div class="sectionhead"><h2>Top 10 '+sport+' Props</h2><span class="pill">Line-specific</span></div><div class="panel"><p class="muted small">Rank by role, hit rate at the exact line, opponent allowance, injury news, model uncertainty and price. Never force ten.</p>'+Array.from({length:10},(_,i)=>'<div class="rank"><span class="number">'+(i+1)+'</span><div class="grow"><strong>Prop research slot</strong><div class="muted small">Verified line · odds · form · opponent · risk</div></div><span class="pill">Pending</span></div>').join('')+'</div>'}else{root.innerHTML='<div class="sectionhead"><h2>'+sport+' Model Review</h2></div><div class="panel"><h2>Postgame learning</h2><p class="muted">Every published prop and SGP leg will be audited for outcome, reasoning quality, role changes, injury, variance, correlation, and safer alternate lines.</p><div class="placeholder">No historical published picks to grade yet.</div></div>'}}document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sport=b.dataset.s;render()});document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});render();</script></body></html>
