<script>
(function(){
"use strict";
var tracked=new Set(['eng.1','esp.1','ita.1','ger.1','fra.1','ned.1','por.1','usa.1','uefa.champions','uefa.europa','uefa.europa.conf','uefa.nations','uefa.euro','uefa.euroq','fifa.world','fifa.worldq.uefa','fifa.worldq.conmebol','fifa.worldq.concacaf','fifa.friendly','concacaf.nations.league','conmebol.copa_america']);
var fmtDay=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',year:'numeric',month:'2-digit',day:'2-digit'});
var S={day:day(new Date()),tab:'matches',league:'all',search:'',board:null,readiness:null,perf:null,fixtures:[],research:null,loading:true,unavailable:false,request:0,detail:null,subtab:'overview',calendarMonth:null};
function el(x){return document.getElementById(x)}
function esc(v){return String(v===undefined||v===null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function day(d){var parts=fmtDay.formatToParts(d);var p={};parts.forEach(function(x){p[x.type]=x.value});return p.year+'-'+p.month+'-'+p.day}

function dtime(d){var k=new Date(d);return Number.isNaN(+k)?'TBD':k.toLocaleTimeString('en-US',{timeZone:'America/Toronto',hour:'numeric',minute:'2-digit',hour12:true})+' ET'}
function resUrl(kind,date){return '/api/footyedge?kind='+encodeURIComponent(kind)+(date?'&date='+encodeURIComponent(date):'')}
async function read(kind,date){var r=await fetch(resUrl(kind,date),{cache:'no-store'});if(!r.ok)throw new Error(kind+' not published');return r.json()}
function first(p){return p&&typeof p==='object'?p:null}
function num(p){var n=Number(p);return p===null||p===undefined||p===''||!isFinite(n)?null:n}
function pick(g){return g&&(g.top||(Array.isArray(g.top3)?g.top3[0]:null))||null}
function pickedScore(p){return p?num(p.score):null}
function odds(p){var n=p&&num(p.odds);return p&&(p.bookExact||p.verifiedPrice||p.verifiedOdds)&&n!==null?(n>0?'+':'')+n:'N/A'}
function logo(g,s){var t=g.teams&&g.teams[s];return t&&t.logo||''}
function name(g,s){var t=g.teams&&g.teams[s];return String((t&&t.name)||g[s]||'Unknown').trim()}
function teamTag(g,s){var l=logo(g,s);return '<div class="team">'+(l?'<img src="'+esc(l)+'" alt="" onerror="this.style.visibility=&#39;hidden&#39;">':'<span class="symbol">⚽</span>')+'<b>'+esc(name(g,s))+'</b></div>'}
function exclude(g){var s=[g.leagueName,g.league,g.competition,g.gender,g.seasonSlug,g.source,g.round].join(' ').toLowerCase();return /women|female|ladies/.test(s)}
function sourceFixtures(raw,date){return (raw&&raw.response||[]).filter(function(x){var l=x.league||{};var league=String(l.name||'').toLowerCase();var meta=[l.name,l.round,l.country,x.fixture&&x.fixture.season,x.competitions&&x.competitions[0]&&x.competitions[0].type&&x.competitions[0].type.name].join(' ').toLowerCase();return tracked.has(league)&&!(/women|female|ladies/.test(meta))&&x.fixture&&x.fixture.date&&day(new Date(x.fixture.date))===date&&!/CANC|POST/.test(x.fixture.status&&x.fixture.status.short||'')}).map(function(x){return {id:String(x.fixture.id),home:x.teams.home.name,away:x.teams.away.name,teams:x.teams,date:x.fixture.date,league:String(x.league.name||''),leagueName:String(x.league.name||'').toUpperCase(),top:null,top3:[],status:x.fixture.status&&x.fixture.status.short,goals:x.goals,fromSchedule:true}})}
function normalized(g){return {id:String(g.id),home:name(g,'home'),away:name(g,'away'),teams:g.teams,date:g.date,league:g.league||'',leagueName:g.leagueName||g.league||'',top:g.top,top3:g.top3||[],model:g.model,teamNews:g.teamNews,news:g.news,whyThisPick:g.whyThisPick,facts:g.facts,history:g.history,status:g.status,goals:g.goals,fromSchedule:g.fromSchedule}}
function status(g){var st=String(g.status&&g.status.short||g.status||'').toUpperCase();if(['FT','AET','PEN','FINAL'].includes(st))return ['Full Time','completed'];if(['1H','2H','HT','ET','LIVE','IN'].includes(st))return ['In play','playing'];return [dtime(g.date),'']}
function note(){var record=(S.readiness&&S.readiness.days||[]).find(function(x){return x.date===S.day});var next=S.board&&S.board.nextGameDate||record&&record.nextGameDate;var noGames=S.fixtures.length===0;var inFuture=S.day>day(new Date());if(S.unavailable&&!(record&&record.scheduledGames===0)&&!S.board)return 'Schedule could not be verified for '+dlabel(S.day)+'. Please try Refresh.';if(noGames)return 'No games '+(S.day===day(new Date())?'today':'on '+dlabel(S.day))+'.'+(next?' Next game on '+dlabel(next)+'.':'');return inFuture?'Fixture research is available, but picks are only published and locked on game day.': 'Official selections are not available for this date. Fixtures alone are not betting picks.'}
function allGames(){var arr=(S.board&&Array.isArray(S.board.games)?S.board.games:[]).filter(function(x){return !exclude(x)}).map(normalized);var ids=new Set(arr.map(function(g){return g.id}));S.fixtures.forEach(function(g){if(!ids.has(g.id)){arr.push(normalized(g));ids.add(g.id)}});return arr.sort(function(a,b){return new Date(a.date)-new Date(b.date)})}
function filtered(){return allGames().filter(function(g){var q=S.search.toLowerCase();return (S.league==='all'||String(g.league)===S.league)&&(!q||[name(g,'home'),name(g,'away'),pick(g)&&pick(g).label,g.leagueName].join(' ').toLowerCase().includes(q))})}
function leagueName(id){return {'uefa.nations':'Nations League','eng.1':'Premier League','esp.1':'La Liga','ita.1':'Serie A','ger.1':'Bundesliga','fra.1':'Ligue 1','uefa.champions':'Champions League','uefa.europa':'Europa League','usa.1':'MLS','fifa.friendly':'Friendly','fifa.worldq.uefa':'World Cup Qualifiers'}[id]||id.replace(/\.1$/,'').replaceAll('.',' ').toUpperCase()}
function leagues(){var opts={};allGames().forEach(function(g){if(g.league)opts[g.league]=true});var items=[['all','All']].concat(Object.keys(opts).sort().map(function(x){return [x,leagueName(x)]}));if(!opts[S.league]&&S.league!=='all')S.league='all';el('leagues').innerHTML=items.map(function(x){return '<button class="league'+(S.league===x[0]?' sel':'')+'" data-league="'+esc(x[0])+'">'+(x[0]==='all'?'⚽ ':'')+esc(x[1])+'</button>'}).join('')}
function dateTitle(){el('date').innerHTML=esc(dlabel(S.day))+' <small>▾</small>'}
function topPicks(){var list=(S.board&&S.board.top5||[]).filter(function(t){var gm=allGames().find(function(g){return g.id===String(t.gameId)});return (S.league==='all'||gm&&gm.league===S.league)&&(!S.search||[t.home,t.away,t.pick&&t.pick.label].join(' ').toLowerCase().includes(S.search.toLowerCase()))});return list}
function panelTitle(){var titles={matches:'Soccer <em>·</em> Matches',picks:'FootyEdge <em>·</em> Top 5',analysis:'Soccer <em>·</em> Analysis',tracking:'Performance <em>·</em> Hit Rate'};el('title').innerHTML=titles[S.tab];el('source').textContent=S.loading?'Updating…':S.unavailable?'Partial feed':S.board?'Official board':'Official schedule'}
function empty(title,body){return '<div class="empty"><span class="em">⚽</span><b>'+esc(title)+'</b>'+esc(body||'')+'</div>'}
function headMatch(g){return '<div class="fixture">'+teamTag(g,'home')+'<div class="center"><b>'+((g.goals&&g.goals.home!==null&&g.goals.away!==null&&['FT','AET','PEN','FINAL','1H','2H','HT'].includes(String(g.status&&g.status.short||g.status||'')))?esc(g.goals.home)+' : '+esc(g.goals.away):'VS')+'</b><small>'+esc(dtime(g.date))+'</small></div>'+teamTag(g,'away')+'</div>'}
function matchHtml(g){var p=pick(g);var st=status(g);return '<article class="card"><div class="matchtop"><span class="competition"><span class="cicon">⚽</span>'+esc(leagueName(g.league||g.leagueName))+'</span><span class="matchstatus '+st[1]+'">'+esc(st[0])+'</span></div><button class="matchmain" data-game="'+esc(g.id)+'">'+headMatch(g)+'</button><div class="matchfooter">'+(p?'<div class="scorenote"><i class="scoreline"></i><span>Top pick · <strong>'+esc(p.label||'Selection')+'</strong></span></div>':'<span>Match preview '+(g.fromSchedule?'· no published pick':'· no selection')+'</span>')+'<button class="cta" style="border:0;background:transparent" data-game="'+esc(g.id)+'">View analysis  ›</button></div></article>'}
function matches(){var a=filtered();return a.length?a.map(matchHtml).join(''):empty(S.fixtures.length||allGames().length?'No matching matches':'No games scheduled',S.search?'Try clearing the search.':note())}
function topHtml(){var a=topPicks();if(!a.length)return empty('No official Top 5 published',note());return a.map(function(t,i){var p=t.pick||{};return '<article class="card pickrow" role="button" tabindex="0" data-game="'+esc(t.gameId)+'"><span class="rank">'+esc(t.rank||i+1)+'</span><div class="picknames"><b>'+esc(t.home)+' vs '+esc(t.away)+'</b><small>'+esc(p.label||'Unknown market')+'</small></div><div class="pickscores"><b>'+esc(pickedScore(p)===null?'—':pickedScore(p)+'/100')+'</b><small>'+esc(odds(p))+'</small></div></article>'}).join('')}
function analysisHtml(){var a=filtered().filter(function(g){return !!pick(g)});if(!a.length)return empty('Analysis not yet published',note());return '<div class="notice"><b>Published research only.</b> AI Analysis uses the original model output. No new selections are inferred in this experimental interface.</div>'+a.map(function(g){var p=pick(g);return '<article class="card analysisCard"><div style="display:flex;justify-content:space-between;gap:8px"><h3>'+esc(name(g,'home'))+' vs '+esc(name(g,'away'))+'</h3><span class="picktag">'+esc(pickedScore(p)||'—')+'/100</span></div><div class="explain">PICK #1 · '+esc(p.label||'')+'</div><p>'+esc(why(g,p))+'</p><button class="league" data-game="'+esc(g.id)+'" style="width:100%;text-align:center">Full match breakdown ›</button></article>'}).join('')}
function percent(v){var n=num(v);return n===null?'—':Math.round(n)+'%'}
function performanceHtml(){var p=S.perf;if(!p)return empty('Tracking unavailable','The official performance feed could not be loaded.');var m=p.month||{},y=p.year||{};var cards=[['October Tracking',m],['2026 Tracking',y]];return '<div class="statsgrid">'+cards.map(function(z){var x=z[1];return '<div class="metric green"><small>'+z[0]+'</small><strong>'+percent(x.hitRate)+'</strong><p>Hit Rate · '+esc(x.settled||0)+' settled</p></div>'}).join('')+'</div><div class="card trackList"><div style="padding:15px;font-size:13px;font-weight:900">Recent settled Top 5</div>'+((p.previousTop5||[]).length?p.previousTop5.map(function(x){var ok=x.result==='hit';return '<div class="trackline"><span>'+esc((x.home||'')+' vs '+(x.away||''))+'<br><small style="color:#8894a0">'+esc(x.selection||'')+'</small></span><strong class="'+(ok?'resultHit':'resultMiss')+'">'+esc(x.result==='hit'?'✓ Hit':x.result==='miss'?'✕ Miss':x.result||'Pending')+'</strong></div>'}).join(''):'<div class="trackline">No settled picks in the current feed.</div>')+'</div><div class="notice" style="margin-top:13px">Tracking comes from official saved results. Process-quality reviews and model learning continue on the main FootyEdge workflow.</div>'}
function render(){dateTitle();leagues();panelTitle();var a=filtered();var meta=S.tab==='matches'?a.length+' matches':S.tab==='picks'?topPicks().length+' ranked':S.tab==='analysis'?a.filter(function(g){return pick(g)}).length+' analyzed':'Official results';el('source').textContent=S.loading?'Loading…':meta;el('mainContent').innerHTML=S.loading?empty('Loading','Fetching official FootyEdge records…'):S.tab==='matches'?matches():S.tab==='picks'?topHtml():S.tab==='analysis'?analysisHtml():performanceHtml();document.querySelectorAll('[data-tab]').forEach(function(x){var on=x.dataset.tab===S.tab;x.classList.toggle('selected',on);x.setAttribute('aria-selected',on?'true':'false')})}
function setTab(t){S.tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
async function load(){var req=++S.request;S.loading=true;S.unavailable=false;S.board=null;S.fixtures=[];S.research=null;render();var r=await Promise.allSettled([read('board',S.day),read('readiness'),read('performance'),read('fixtures',S.day),read('research',S.day)]);if(req!==S.request)return;S.board=r[0].status==='fulfilled'?r[0].value:null;S.readiness=r[1].status==='fulfilled'?r[1].value:null;S.perf=r[2].status==='fulfilled'?r[2].value:null;S.research=r[4].status==='fulfilled'?r[4].value:null;
if(r[3].status==='fulfilled'){S.fixtures=sourceFixtures(r[3].value,S.day)}else{var b=(S.readiness&&S.readiness.days||[]).find(function(x){return x.date===S.day});if(!S.board&&(!b||b.scheduledGames!==0))S.unavailable=true}
S.loading=false;render()}
function findGame(id){return allGames().find(function(g){return String(g.id)===String(id)})}
function why(g,p){var candidates=[p&&p.why,p&&p.reason,p&&p.commentary,p&&p.archivedCommentary,g.whyThisPick];for(var i=0;i<candidates.length;i++){var v=candidates[i];if(typeof v==='string'&&v.trim()){if(v==='Original published explanation was not saved.')return 'Original pre-match explanation was not archived. It cannot be reconstructed from the final score.';return v}if(v&&typeof v==='object'&&(v.text||v.summary))return v.text||v.summary}return 'No verified explanation was saved for this selection.'}
function factsFor(g){var research=S.research&&S.research.fixtures&&S.research.fixtures.find(function(x){return String(x.id)===String(g.id)});return Array.isArray(g.facts)?g.facts:Array.isArray(research&&research.facts)?research.facts:[]}
function safeText(x){if(typeof x==='string')return x;if(x&&typeof x==='object')return x.text||x.summary||x.note||'';return ''}
function news(g,side){var x=g.teamNews||g.news||g.availability||{};return safeText(x[side]||x[side+'Team'])||'No material verified team-news update was archived; no additional adjustment is displayed.'}
function subView(g,tab){var p=pick(g);var arr=g.top3||[];var facts=factsFor(g);var verified=!!S.board;
if(tab==='overview')return '<div class="detailTitle">Match overview</div><div class="detailText">'+(p?'Top published selection: '+esc(p.label||'')+'. '+esc(why(g,p)):'No official match prediction has been published for this fixture. The lab does not substitute a research preview for the locked model.')+'</div><div class="detailTitle">Match information</div><div class="detailstat"><div class="lhs"><b>Competition</b><small>'+esc(leagueName(g.league||g.leagueName))+'</small></div><div class="rhs">'+esc(dtime(g.date))+'</div></div>';
if(tab==='picks')return '<div class="detailTitle">FootyEdge Top 3</div>'+(verified&&arr.length?arr.map(function(x,i){return '<div class="detailstat"><div class="lhs"><b>Pick #'+(i+1)+' · '+esc(x.label||'Unavailable')+'</b><small>'+esc(x.category||'Market')+' · '+(x.verifiedPrice||x.bookExact?'Verified odds':'Odds unavailable')+'</small></div><div class="rhs">'+esc(pickedScore(x)===null?'—':pickedScore(x)+'/100')+'<small>'+esc(odds(x))+'</small></div></div>'}).join(''):empty('No published Top 3','Only the main FootyEdge official board can publish or lock picks.'))+(p?'<div class="detailTitle">WHY THIS PICK</div><p class="detailText">'+esc(why(g,p))+'</p>':'');
if(tab==='form')return '<div class="detailTitle">Last 10 · verified research</div>'+(facts.length?facts.slice(0,12).map(function(x){return '<div class="detailstat"><div class="lhs"><b>'+esc(x.text||x)+'</b></div></div>'}).join(''):empty('Form details unavailable','No verified last-10 research snapshot was found for this match.'));
if(tab==='h2h')return '<div class="detailTitle">Head-to-head</div>'+empty('Verified H2H unavailable','Head-to-head records are shown only when the published data includes them. Historical meetings are not inferred.');
if(tab==='news')return '<div class="detailTitle">TEAM NEWS</div><div class="twoTeams"><div class="news"><strong>'+esc(name(g,'home'))+'</strong>'+esc(news(g,'home'))+'</div><div class="news"><strong>'+esc(name(g,'away'))+'</strong>'+esc(news(g,'away'))+'</div></div><p class="detailText" style="margin-top:18px">A confirmed lineup or injury adjustment is shown only if it was saved by the official research process.</p>';
return '' }
function detail(){var g=findGame(S.detail);if(!g){closeDetail();return}var tabs=[['overview','Overview'],['picks','Top 3 Picks'],['form','Last 10'],['h2h','H2H'],['news','Team News']];el('detailBody').innerHTML='<div class="detailFixture">'+teamTag(g,'home')+'<div class="center">VS<br><small>'+esc(dtime(g.date))+'</small></div>'+teamTag(g,'away')+'</div><div class="subtabs">'+tabs.map(function(x){return '<button data-sub="'+x[0]+'" class="'+(x[0]===S.subtab?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div><div id="subview">'+subView(g,S.subtab)+'</div>'}
function openGame(id){if(!findGame(id))return;S.detail=id;S.subtab='overview';detail();el('detailCover').classList.add('on');document.body.style.overflow='hidden'}
function closeDetail(){el('detailCover').classList.remove('on');document.body.style.overflow='';S.detail=null}
function calendar(){var month=S.calendarMonth||S.day.slice(0,7);var [yy,mm]=month.split('-').map(Number);el('monthName').textContent=new Date(Date.UTC(yy,mm-1,1)).toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'});var firstDay=new Date(Date.UTC(yy,mm-1,1)).getUTCDay(),total=new Date(Date.UTC(yy,mm,0)).getUTCDate();var html=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(s){return '<div>'+s+'</div>'}).join('');for(var z=0;z<firstDay;z++)html+='<span></span>';for(var d=1;d<=total;d++){var value=month+'-'+String(d).padStart(2,'0');html+='<button data-day="'+value+'" class="'+(S.day===value?'active':'')+'">'+d+'</button>'}el('calendarDays').innerHTML=html}
function showCalendar(){S.calendarMonth=S.day.slice(0,7);calendar();el('calendarCover').classList.add('on')}
function closeCalendar(){el('calendarCover').classList.remove('on')}
document.addEventListener('click',function(e){var sub=e.target.closest('[data-sub]');if(sub){S.subtab=sub.dataset.sub;detail();return}var game=e.target.closest('[data-game]');if(game){openGame(game.dataset.game);return}var tab=e.target.closest('[data-tab]');if(tab){setTab(tab.dataset.tab);return}var lg=e.target.closest('[data-league]');if(lg){S.league=lg.dataset.league;render();return}var dt=e.target.closest('[data-day]');if(dt){S.day=dt.dataset.day;S.league='all';closeCalendar();load()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDetail();closeCalendar()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.pickrow[data-game]')){e.preventDefault();openGame(e.target.dataset.game)}});
el('prev').onclick=function(){S.day=move(S.day,-1);S.league='all';load()};el('next').onclick=function(){S.day=move(S.day,1);S.league='all';load()};el('today').onclick=function(){S.day=day(new Date());S.league='all';load()};
el('date').onclick=showCalendar;el('calendarToggle').onclick=showCalendar;el('closeCalendar').onclick=closeCalendar;el('calendarCover').onclick=function(e){if(e.target===el('calendarCover'))closeCalendar()};
el('monthPrev').onclick=function(){S.calendarMonth=move(S.calendarMonth+'-15',-31).slice(0,7);calendar()};el('monthNext').onclick=function(){var v=S.calendarMonth.split('-').map(Number);S.calendarMonth=new Date(Date.UTC(v[0],v[1],1)).toISOString().slice(0,7);calendar()};
el('calendarToday').onclick=function(){S.day=day(new Date());S.league='all';closeCalendar();load()};
el('searchToggle').onclick=function(){var a=el('searchArea');a.style.display=a.style.display==='none'?'block':'none';if(a.style.display==='block')el('search').focus()};
el('search').oninput=function(e){S.search=e.target.value.trim();render()};
el('closeDetail').onclick=closeDetail;el('detailCover').onclick=function(e){if(e.target===el('detailCover'))closeDetail()};
load();
})();
</script></body></html>
