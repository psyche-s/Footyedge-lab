<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07120e"><title>FootyEdge Lab | NHL NFL MLB</title><style>body{margin:0;background:#07120e;color:#edf8f1;font:15px system-ui,-apple-system,sans-serif}main{max-width:1050px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #214133;padding:18px 20px}.brand{font-weight:900;letter-spacing:.06em}.green{color:#62e4a2}nav,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{border:1px solid #31503e;background:#10241b;color:#cce8d8;border-radius:11px;padding:12px 20px;font-weight:700;cursor:pointer}button.active{background:#227d51;color:white;border-color:#45c786}.panel{background:#0e2118;border:1px solid #254634;border-radius:17px;padding:20px;margin:15px 0}.muted{color:#99b3a3}h1{font-size:28px}h2{font-size:19px}.item{display:flex;gap:15px;align-items:center;padding:16px 0;border-top:1px solid #284133}.rank{font-size:22px;color:#62e4a2;width:32px}.pill{margin-left:auto;border:1px solid #44634f;padding:6px 10px;border-radius:20px;font-size:12px;color:#b9cbbb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.small{font-size:13px;line-height:1.6}footer{color:#91ac9b;font-size:12px;margin:30px 0}@media(max-width:600px){h1{font-size:24px}main{padding:15px}header{padding:15px}}</style></head><body><header><span class="brand">FOOTYEDGE <span class="green">LAB</span></span><span class="muted">Sports Intelligence</span></header><main><h1 id="heading">NHL Research Dashboard</h1><p class="muted">Matchup-driven research, verified lines and risk-adjusted selections.</p><nav id="sports"><button class="active" data-sport="NHL">🏒 NHL</button><button data-sport="NFL">🏈 NFL</button><button data-sport="MLB">⚾ MLB</button></nav><div class="tabs" id="tabs"><button class="active" data-tab="sgp">Top 3 SGPs</button><button data-tab="props">Top 10 Props</button><button data-tab="analysis">Match Analysis</button><button data-tab="review">Model Review</button></div><section id="view"></section><footer>Research only. No selection is published without verified data, current sportsbook lines and matchup validation. No picks are guaranteed. Gamble responsibly.</footer></main><script>let sport="NHL",tab="sgp";const model={NHL:["Shot attempts and shot-on-goal floor","Ice time, power-play usage and role stability","Opponent shots allowed by position","Last 5/10, prior season and H2H","Defensive pairings, pace and game script"],NFL:["Snap share, routes, targets and carries","Passing attempts and expected game script","Coverage scheme and positional allowances","Injuries, lineups and red-zone role","Last 5/10 and historical matchup trends"],MLB:["Starter workload, outs and early-pull risk","Strikeouts, walks, earned runs and hits allowed","Opponent splits by pitcher handedness","Confirmed lineups, bullpen, park and weather","NRFI, team totals and alternate lines"]};function render(){document.getElementById("heading").textContent=sport+" Research Dashboard";document.querySelectorAll("[data-sport]").forEach(b=>b.classList.toggle("active",b.dataset.sport===sport));document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));let v=document.getElementById("view");if(tab==="sgp"){v.innerHTML='<div class="panel"><h2>Top 3 Same-Game Parlays</h2><p class="muted small">Ranked by risk-adjusted probability, verified combined odds, coherent game script, leg correlation and safer-line alternatives. A weak slate may produce fewer than three.</p>'+[1,2,3].map(n=>'<div class="item"><b class="rank">'+n+'</b><div><b>SGP '+n+'</b><div class="muted small">Awaiting verified markets and matchup analysis</div></div><span class="pill">Not published</span></div>').join("")+'</div>'}else if(tab==="props"){v.innerHTML='<div class="panel"><h2>Top 10 Player Props</h2><p class="muted small">Ranked using line-specific hit rates, opponent allowance, role stability, implied probability and estimated value. Never force ten picks.</p>'+Array.from({length:10},(_,i)=>'<div class="item"><b class="rank">'+(i+1)+'</b><div><b>Prop research slot</b><div class="muted small">Line · Odds · Last 5/10 · Matchup · Confidence · Risk</div></div><span class="pill">Pending</span></div>').join("")+'</div>'}else if(tab==="analysis"){v.innerHTML='<div class="panel"><h2>'+sport+' Matchup Research</h2><div class="grid">'+model[sport].map(x=>'<div class="panel">'+x+'</div>').join("")+'</div><p class="muted small">Live schedules, player data and verified odds feeds must be connected before publishing game-specific analysis.</p></div>'}else{v.innerHTML='<div class="panel"><h2>Post-Game Model Review</h2><p class="muted">Review every published prop and each SGP leg: hit/miss, reasoning quality, game-script changes, injuries, variance, missed safer lines and model calibration.</p><p class="muted small">No historical results are fabricated. Tracking begins when published picks and settled results are stored.</p></div>'}}document.querySelectorAll("[data-sport]").forEach(b=>b.onclick=()=>{sport=b.dataset.sport;render()});document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();</script></body></html>
