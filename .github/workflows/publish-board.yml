name: Publish SportsLab Picks (No Vercel Build)

on:
  push:
    branches: [main]
    paths:
      - 'ops/refresh-now.txt'
  workflow_dispatch:
    inputs:
      league:
        description: Sport to refresh and publish
        required: true
        type: choice
        options: [all, nhl, nfl, mlb, nba]
        default: all
      source:
        description: Primary then free, or public sources only
        required: true
        type: choice
        options: [auto, free]
        default: auto
  schedule:
    - cron: '10 11,12,17,18 * * *'
    # Friday October 9, 2026 at 4:00 PM America/Toronto (20:00 UTC), three hours before NHL 7 PM ET puck drop.
    - cron: '0 20 9 10 *'

permissions:
  contents: write

concurrency:
  group: sportslab-publish-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Toronto publication time
        id: window
        env:
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "league=all" >> "$GITHUB_OUTPUT"
            echo "source=auto" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ]; then
            # Owner can publish the latest NHL research immediately by editing ops/refresh-now.txt.
            # Keep 4 PM scheduled re-publication/freeze intact; an early preview must NOT freeze it.
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "league=nhl" >> "$GITHUB_OUTPUT"
            echo "source=free" >> "$GITHUB_OUTPUT"
            echo "Owner requested immediate NHL refresh"
          else
            today="$(TZ=America/Toronto date +%Y-%m-%d)"
            hour="$(TZ=America/Toronto date +%H)"
            # Friday's 7 PM NHL game is the earliest; publish the whole NHL slate at 4 PM.
            # Do not publish at the usual 7 AM/1 PM slots on this date.
            if [ "$today" = "2026-10-09" ]; then
              if [ "$hour" = "16" ]; then
                echo "allowed=true" >> "$GITHUB_OUTPUT"
                echo "league=nhl" >> "$GITHUB_OUTPUT"
                echo "source=free" >> "$GITHUB_OUTPUT"
                echo "Friday NHL pregame publication at 4 PM ET"
              else
                echo "allowed=false" >> "$GITHUB_OUTPUT"
              fi
            elif [ "$hour" = "07" ] || [ "$hour" = "13" ]; then
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              echo "league=all" >> "$GITHUB_OUTPUT"
              echo "source=auto" >> "$GITHUB_OUTPUT"
            else
              echo "allowed=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Checkout SportsLab
        if: steps.window.outputs.allowed == 'true'
        uses: actions/checkout@v4
      - name: Prepare Node.js
        if: steps.window.outputs.allowed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify market math, NHL usage, and fantasy data integrity
        if: steps.window.outputs.allowed == 'true'
        run: node --test tests/market-and-nhl-opportunity.test.js tests/nhl-possession.test.js tests/nhl-position-allowance.test.js tests/ui-plain-picks.test.js
      - name: Collect current picks without building website
        if: steps.window.outputs.allowed == 'true'
        env:
          INPUT_LEAGUE: ${{ github.event_name == 'workflow_dispatch' && inputs.league || steps.window.outputs.league }}
          INPUT_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || steps.window.outputs.source }}
        run: node scripts/publish-board.js
      - name: Publish board data in Releases without code commit
        if: steps.window.outputs.allowed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          shopt -s nullglob
          files=(published/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No verified data available to publish"
            exit 1
          fi
          for file in "${files[@]}"; do
            sport="$(basename "$file" .json)"
            tag="sportslab-board-$sport"
            if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release edit "$tag" --repo "$GH_REPO" --notes-file "$file"
              echo "Updated $sport board with no new Vercel deployment"
            else
              upper="$(printf '%s' "$sport" | tr '[:lower:]' '[:upper:]')"
              gh release create "$tag" --repo "$GH_REPO" --target main --title "SportsLab data - $upper" --notes-file "$file" --latest=false
              echo "Created first $sport board release"
            fi
            # Preserve first pregame edition for honest later grading. Later manual/midday refreshes
            # update the current release but never rewrite the morning evidence.
            today="$(TZ=America/Toronto date +%Y-%m-%d)"
            hour="$(TZ=America/Toronto date +%H)"
            freeze="sportslab-freeze-${sport}-${today}"
            if [ "$TRIGGER_EVENT" != "push" ] && { [ "$hour" -lt 11 ] || { [ "$today" = "2026-10-09" ] && [ "$hour" = "16" ] && [ "$sport" = "nhl" ]; }; } && ! gh release view "$freeze" --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release create "$freeze" --repo "$GH_REPO" --target main --title "Pregame freeze ${today} ${sport^^}" --notes-file "$file" --latest=false
              echo "Preserved immutable morning ${sport} picks for after-game review"
            fi
          done
